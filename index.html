<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full w-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#020617" />
  <!-- Real manifest file (a data: URI manifest can't be installed, so "Add to Home Screen" kept the address bar) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>רחוב הברוש - קיבוץ דפנה</title>

  <!-- Pinned versions: unpinned CDN URLs can silently jump a major version and break the game -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.10/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    * { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html {
      height: 100vh; height: 100dvh; width: 100vw; margin: 0; padding: 0;
      overflow: hidden; overscroll-behavior: none;
      font-family: 'Rubik', sans-serif; background-color: #020617; box-sizing: border-box;
    }
    #root { height: 100%; width: 100%; display: flex; flex-direction: column; }
    canvas { display: block; touch-action: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    @keyframes toastIn { 0% { transform: translateX(-16px) scale(.9); opacity: 0; } 60% { transform: translateX(3px) scale(1.04); } 100% { transform: none; opacity: 1; } }
    .toast-in { animation: toastIn .25s ease-out; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .pop { animation: pop .35s ease-out; }
    /* Short landscape phones (iPhone ≈ 340px tall): compact overlays so nothing is cut off */
    @media (max-height: 420px) {
      .start-title { font-size: 30px !important; line-height: 1.1; margin-bottom: 2px !important; }
      .start-btn { font-size: 18px !important; padding: 8px 32px !important; }
      .start-hint { margin-top: 6px !important; }
      .compact-pad { padding: 10px !important; }
      .start-logo { width: 36px !important; height: 36px !important; }
    }
    .safe-x { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }

    /* Rotate-device overlay: phones/tablets in portrait only */
    input { user-select: text; -webkit-user-select: text; }
    #rotate { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
    body.typing #rotate { display: none !important; } /* a keyboard can make the viewport look "portrait" */
    @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    .tilt { animation: tilt 1.6s ease-in-out infinite alternate; }
  </style>
</head>
<body class="bg-slate-950 text-white h-full w-full flex flex-col justify-between overflow-hidden select-none">

  <div id="root">
    <div style="margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;color:#34d399;font-weight:800;font-size:20px">
      <img src="logo.png" alt="" style="width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px #0008" />
      טוען את רחוב הברוש...
    </div>
  </div>

  <div id="rotate" style="position:fixed;inset:0;z-index:100;background:#020617;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#e2e8f0;text-align:center;padding:24px">
    <div class="tilt" style="font-size:64px">📱</div>
    <div style="font-size:20px;font-weight:800;color:#34d399">סובבו את המכשיר לרוחב</div>
    <div style="font-size:14px;color:#94a3b8">רחוב הברוש רחב מדי בשביל מסך עומד 🌳</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useSyncExternalStore } = React;

    // ================= CONFIG =================
    const W = 1100, H = 600;                 // world size (6 houses per side)
    const VIEW_H = 530, VIEW_Y = 35;         // camera shows y 35..565 (trims empty grass so the street is bigger)
    const ROUND_SECONDS = 180;
    const RUSH_SECONDS = 30;                 // last 30s: double points
    const DOOR_N = 150, DOOR_S = 452;        // where the player "knocks"
    const PLAYER_MIN_Y = 158, PLAYER_MAX_Y = 446;
    const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

    // ---- Address-bar / fullscreen strategy ----
    // A web page can only hide the browser UI in two ways:
    //  1. Fullscreen API (Android Chrome, desktop, iPad) — needs a user tap, and the user can exit it (back gesture),
    //     so we re-enter on the next tap during play.
    //  2. Launching from the home screen (manifest display:fullscreen / iOS apple-mobile-web-app-capable).
    //     iPhone Safari has NO fullscreen API for pages, so on iPhone this is the only way — we show instructions.
    const IS_STANDALONE = ['fullscreen', 'standalone', 'minimal-ui'].some(m => window.matchMedia(`(display-mode: ${m})`).matches) || navigator.standalone === true;
    const CAN_FULLSCREEN = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    // ================= LEADERBOARD CONFIG (Firebase Firestore) =================
    // Paste your Firebase web app's apiKey + projectId here to turn on the shared leaderboard.
    // Leave empty = local-only leaderboard (scores saved on this device).
    const FIREBASE = { apiKey: 'AIzaSyASSDbF7es8NWCvU22Cp4K05KGDmfaHJFM', projectId: 'brosh-game' };

    // ================= LOCAL STORAGE =================
    const ls = {
      get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    };

    // ================= TINY STORE (single source of truth for React + Phaser) =================
    // Fixes the old race where Phaser read inventory through a useEffect-synced copy
    // (two pickups in the same frame could overwrite each other).
    const store = {
      s: {
        phase: 'START',   // START | PLAYING | TOLEDO | OVER
        score: 0, favors: 1, combo: 1, timeLeft: ROUND_SECONDS,
        inventory: [], toast: null, near: null, toledoWait: 0, rush: false, muted: false,
        stats: { deliveries: 0, bestCombo: 1, missed: 0, hits: 0 }, final: null,
        profile: null, overlay: null, wanted: {}, intro: true, board: { status: 'idle', rows: [], local: true }, submit: null, fs: false,
      },
      subs: new Set(),
      get: () => store.s,
      set(patch) {
        store.s = { ...store.s, ...(typeof patch === 'function' ? patch(store.s) : patch) };
        store.subs.forEach(f => f());
      },
      sub(f) { store.subs.add(f); return () => store.subs.delete(f); },
    };
    // Words addressed to the player follow the gender they picked in the character editor
    const G = (m, f) => (store.s.profile?.look?.gender === 'f' ? f : m);
    const toast = (msg, kind = 'info') => store.set({ toast: { msg, kind, id: Math.random() } });
    const addStat = (k, v = 1) => store.set(s => ({ stats: { ...s.stats, [k]: s.stats[k] + v } }));
    const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

    // ================= SVG ASSETS =================
    const createSVGDataURI = (svg) => {
      const encoded = encodeURIComponent(svg).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1));
      return 'data:image/svg+xml;base64,' + window.btoa(encoded);
    };

    // ---------- Character look options (used by the customizer, the player sprite and rivals) ----------
    const LOOK = {
      gender: [{ id: 'm', label: '👨 גבר' }, { id: 'f', label: '👩 אישה' }],
      hair: [{ id: 'short', label: 'קצר' }, { id: 'long', label: 'ארוך' }, { id: 'curly', label: 'מתולתל' }, { id: 'pony', label: 'קוקו' }],
      hairColor: ['#1c1917', '#5b3a1e', '#a0522d', '#e3b85f', '#c2410c', '#9ca3af'],
      skin: ['#fde3c8', '#f5c99f', '#e0a878', '#b9774a', '#7b4a2c'],
      outfit: [
        { id: 'work', label: 'בגדי עבודה', shirt: '#2563eb', bottom: '#a8a29e', kind: 'shorts' },
        { id: 'tee', label: 'טי-שירט', shirt: '#10b981', bottom: '#1e3a8a', kind: 'pants' },
        { id: 'overalls', label: 'סרבל', shirt: '#f8fafc', bottom: '#2563eb', kind: 'overalls' },
        { id: 'dress', label: 'שמלה', shirt: '#e11d48', bottom: '#e11d48', kind: 'dress' },
        { id: 'sport', label: 'אימונית', shirt: '#7c3aed', bottom: '#7c3aed', kind: 'pants', sleeves: true },
        { id: 'shabbat', label: 'לבן של שבת', shirt: '#ffffff', bottom: '#334155', kind: 'pants' },
      ],
      hat: [{ id: 'none', label: 'בלי' }, { id: 'tembel', label: 'טמבל' }, { id: 'cap', label: 'מצחייה' }],
    };
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const randomLook = () => {
      const gender = pick(['m', 'f']);
      return {
        gender, hair: gender === 'f' ? pick(['long', 'pony', 'curly']) : pick(['short', 'curly', 'short']),
        hairColor: pick(LOOK.hairColor), skin: pick(LOOK.skin), outfit: pick(LOOK.outfit).id, hat: pick(['none', 'none', 'tembel', 'cap']),
      };
    };
    const NAMES = {
      m: ['צביקה', 'דודו', 'יוסי', 'איתי', 'גלעד', 'עמרי', 'שמוליק', 'אורי', 'בועז', 'נמרוד'],
      f: ['שולה', 'מיכל', 'נועה', 'רותי', 'תמר', 'יעל', 'דפנה', 'אורנה', 'ליאת', 'חגית'],
    };
    const PLACES = ['מהרפת', 'מהלול', 'מהמכבסה', 'מהבריכה', 'מהמטבח', 'מהפרדס', 'מהמוסך', 'מהגן'];
    const randomName = (g = 'm') => `${pick(NAMES[g] || NAMES.m)} ${pick(PLACES)}`.slice(0, 16);

    // Front-facing kibbutznik built from a look
    const person = (look) => {
      const L = { ...randomLook(), ...look };
      const o = LOOK.outfit.find(x => x.id === L.outfit) || LOOK.outfit[0];
      const skin = L.skin, hc = L.hairColor, f = L.gender === 'f';
      const bareLegs = o.kind === 'shorts' || o.kind === 'dress';
      const legs = `
        <rect x="19" y="47" width="7" height="13" rx="3" fill="${bareLegs ? skin : o.bottom}"/>
        <rect x="30" y="47" width="7" height="13" rx="3" fill="${bareLegs ? skin : o.bottom}"/>
        <rect x="18" y="58" width="9" height="3" rx="1.5" fill="#3f2a14"/><rect x="29" y="58" width="9" height="3" rx="1.5" fill="#3f2a14"/>
        ${o.kind === 'shorts' ? `<rect x="17" y="45" width="22" height="7" rx="2" fill="${o.bottom}"/>` : ''}`;
      const arm = (x) => o.sleeves
        ? `<rect x="${x}" y="32" width="7" height="14" rx="3.5" fill="${o.shirt}"/><circle cx="${x + 3.5}" cy="46" r="3.2" fill="${skin}"/>`
        : `<rect x="${x}" y="32" width="7" height="15" rx="3.5" fill="${skin}"/><rect x="${x}" y="31" width="7" height="5" rx="2.5" fill="${o.shirt}"/>`;
      const torsoX = f ? 15 : 14, torsoW = f ? 26 : 28;
      let torso = `<rect x="${torsoX}" y="30" width="${torsoW}" height="20" rx="8" fill="${o.shirt}" stroke="rgba(0,0,0,.22)" stroke-width="1.5"/>`;
      if (o.kind === 'overalls') torso += `<rect x="18" y="38" width="20" height="13" rx="3" fill="${o.bottom}"/><path d="M20 38 L19 30 M36 38 L37 30" stroke="${o.bottom}" stroke-width="2.5"/>`;
      if (o.kind === 'dress') torso += `<path d="M15 42 L41 42 L45 54 L11 54Z" fill="${o.shirt}" stroke="rgba(0,0,0,.2)"/><circle cx="21" cy="47" r="1.5" fill="#fde68a"/><circle cx="33" cy="49" r="1.5" fill="#fde68a"/><circle cx="27" cy="38" r="1.5" fill="#fde68a"/>`;
      if (o.sleeves) torso += `<path d="M28 31 V49" stroke="#ffffff" stroke-width="1.5" opacity=".7"/>`;
      const back = { long: `<path d="M15 34 Q12 10 28 9 Q44 10 41 34 Z" fill="${hc}"/>`, pony: `<ellipse cx="42" cy="22" rx="5" ry="9" fill="${hc}" transform="rotate(20 42 22)"/>` }[L.hair] || '';
      const front = {
        short: `<path d="M17 20 Q28 5 39 20 Q36 13 28 12 Q20 13 17 20Z" fill="${hc}"/>`,
        long: `<path d="M17 21 Q28 4 39 21 Q33 13 28 14 Q22 13 17 21Z" fill="${hc}"/>`,
        curly: `<g fill="${hc}"><circle cx="19" cy="16" r="5"/><circle cx="25" cy="11" r="5.5"/><circle cx="32" cy="11" r="5.5"/><circle cx="38" cy="16" r="5"/></g>`,
        pony: `<path d="M17 20 Q28 5 39 20 Q34 12 28 12 Q21 12 17 20Z" fill="${hc}"/><circle cx="38" cy="15" r="2.5" fill="#f472b6"/>`,
      }[L.hair] || '';
      const hat = {
        tembel: `<path d="M15 17 Q28 0 41 17Z" fill="#a3b18a" stroke="#6b7a55" stroke-width="1.5"/><ellipse cx="28" cy="17" rx="16" ry="3.5" fill="#8a9a6b"/>`,
        cap: `<path d="M17 17 Q28 3 39 17Z" fill="#dc2626"/><path d="M33 16 Q44 14 46 18 L33 18Z" fill="#b91c1c"/>`,
      }[L.hat] || '';
      const face = `
        <circle cx="24" cy="21" r="1.6" fill="#0f172a"/><circle cx="32" cy="21" r="1.6" fill="#0f172a"/>
        ${f ? '<path d="M22 19 l-1.5 -1.5 M34 19 l1.5 -1.5" stroke="#0f172a" stroke-width="1"/><circle cx="21" cy="25" r="2" fill="#fb7185" opacity=".45"/><circle cx="35" cy="25" r="2" fill="#fb7185" opacity=".45"/>' : ''}
        <path d="M24 26 Q28 29 32 26" stroke="#0f172a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      return createSVGDataURI(`
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="64" viewBox="0 0 56 64">
          <ellipse cx="28" cy="60" rx="15" ry="4" fill="#000" opacity=".28"/>
          ${legs}${arm(10)}${arm(39)}${torso}${back}
          <circle cx="28" cy="21" r="11" fill="${skin}"/>
          ${face}${front}${hat}
        </svg>`);
    };

    // ---------- Player profile (saved in localStorage) ----------
    const newProfile = () => {
      const look = { ...randomLook(), hat: 'tembel' };
      return { name: randomName(look.gender), look, pid: Math.random().toString(36).slice(2, 12) };
    };
    const savedProfile = ls.get('cypress_profile', null);
    store.s.profile = savedProfile || newProfile();
    let PLAYER_KEY = 'player';

    const house = ({ wall, roof, door = '#78350f', extra = '' }) => createSVGDataURI(`
      <svg xmlns="http://www.w3.org/2000/svg" width="140" height="110" viewBox="0 0 140 110">
        <ellipse cx="70" cy="104" rx="64" ry="6" fill="#000" opacity=".22"/>
        <rect x="14" y="44" width="112" height="60" rx="3" fill="${wall}" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
        <polygon points="6,47 70,8 134,47" fill="${roof}" stroke="rgba(0,0,0,.3)" stroke-width="2"/>
        <path d="M38 28 L102 28 M22 38 L118 38" stroke="rgba(0,0,0,.18)" stroke-width="2"/>
        <!-- solar water heater (dud shemesh) -->
        <rect x="88" y="14" width="22" height="9" rx="4.5" fill="#e2e8f0" stroke="#64748b"/>
        <rect x="84" y="24" width="28" height="7" fill="#1e40af" stroke="#0f172a" stroke-width="1"/>
        <rect x="56" y="68" width="28" height="36" rx="3" fill="${door}"/>
        <circle cx="78" cy="87" r="2" fill="#fde047"/>
        <rect x="24" y="56" width="22" height="20" fill="#bfdbfe" stroke="#334155" stroke-width="2"/>
        <rect x="94" y="56" width="22" height="20" fill="#bfdbfe" stroke="#334155" stroke-width="2"/>
        <path d="M24 61 h22 M24 65 h22 M94 61 h22 M94 65 h22" stroke="#475569" stroke-width="1.5"/>
        <circle cx="16" cy="100" r="9" fill="#15803d"/><circle cx="26" cy="102" r="7" fill="#16a34a"/>
        <circle cx="124" cy="100" r="9" fill="#15803d"/><circle cx="114" cy="102" r="7" fill="#16a34a"/>
        ${extra}
      </svg>`);

    const GRAPHICS = {
      player: person(store.s.profile.look),
      ai_0: person(randomLook()), ai_1: person(randomLook()), ai_2: person(randomLook()), ai_3: person(randomLook()),

      house_a: house({ wall: '#fef3c7', roof: '#c2410c' }),
      house_b: house({ wall: '#e0f2fe', roof: '#b91c1c' }),
      house_c: house({ wall: '#fce7f3', roof: '#9a3412' }),
      house_d: house({ wall: '#dcfce7', roof: '#be123c' }),
      house_e: house({ wall: '#ede9fe', roof: '#7c2d12' }),
      house_f: house({ wall: '#ffedd5', roof: '#991b1b' }),
      house_player: house({ wall: '#93c5fd', roof: '#1e40af', door: '#1e293b',
        extra: '<path d="M70 62 c-4 -6 -12 -2 -8 4 l8 7 l8 -7 c4 -6 -4 -10 -8 -4z" fill="#ef4444"/>' }),
      house_toledo: createSVGDataURI(`
        <svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
          <ellipse cx="80" cy="114" rx="74" ry="6" fill="#000" opacity=".25"/>
          <rect x="12" y="42" width="136" height="72" rx="4" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
          <polygon points="2,45 80,4 158,45" fill="#7c2d12" stroke="#451a03" stroke-width="3"/>
          <path d="M2 45 L158 45" stroke="#fde68a" stroke-width="3"/>
          <rect x="22" y="50" width="8" height="64" fill="#fef3c7"/><rect x="130" y="50" width="8" height="64" fill="#fef3c7"/>
          <rect x="44" y="50" width="8" height="64" fill="#fef3c7"/><rect x="108" y="50" width="8" height="64" fill="#fef3c7"/>
          <path d="M64 114 V82 Q80 64 96 82 V114Z" fill="#451a03"/>
          <circle cx="90" cy="98" r="2.5" fill="#fde047"/>
          <path d="M62 30 l6 -12 l6 8 l6 -12 l6 12 l6 -8 l6 12z" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
          <line x1="80" y1="4" x2="80" y2="-6" stroke="#451a03" stroke-width="2"/>
        </svg>`),

      tree_cypress: createSVGDataURI(`
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="96" viewBox="0 0 36 96">
          <ellipse cx="18" cy="92" rx="12" ry="3.5" fill="#000" opacity=".25"/>
          <rect x="15.5" y="78" width="5" height="14" fill="#713f12"/>
          <path d="M18 2 C30 24 32 60 26 82 L10 82 C4 60 6 24 18 2Z" fill="#14532d"/>
          <path d="M17 8 C24 28 25 56 21 78 L13 78 C10 56 11 28 17 8Z" fill="#166534"/>
          <path d="M15 20 C18 34 18 50 16 66" stroke="#22c55e" stroke-width="2" fill="none" opacity=".5"/>
        </svg>`),

      // Vehicles: drawn facing RIGHT; flipped when driving left
      golf_cart: createSVGDataURI(`
        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="66" viewBox="0 0 96 66">
          <rect x="12" y="6" width="68" height="6" rx="3" fill="#16a34a"/>
          <rect x="16" y="10" width="3" height="24" fill="#475569"/><rect x="74" y="10" width="3" height="24" fill="#475569"/>
          <circle cx="44" cy="26" r="7" fill="#fcd9b6"/>
          <path d="M37 24 Q44 15 51 24" fill="#e2e8f0"/>
          <rect x="8" y="32" width="80" height="20" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
          <rect x="82" y="38" width="6" height="5" rx="1.5" fill="#fde047"/>
          <circle cx="26" cy="54" r="9" fill="#1e293b"/><circle cx="26" cy="54" r="3" fill="#cbd5e1"/>
          <circle cx="72" cy="54" r="9" fill="#1e293b"/><circle cx="72" cy="54" r="3" fill="#cbd5e1"/>
        </svg>`),
      scooter_kid: createSVGDataURI(`
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="72" viewBox="0 0 56 72">
          <rect x="6" y="58" width="38" height="5" rx="2" fill="#0284c7"/>
          <line x1="44" y1="60" x2="48" y2="22" stroke="#334155" stroke-width="3"/>
          <line x1="42" y1="22" x2="54" y2="22" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
          <circle cx="10" cy="64" r="5" fill="#0f172a"/><circle cx="44" cy="64" r="5" fill="#0f172a"/>
          <rect x="20" y="40" width="6" height="18" rx="3" fill="#1e3a8a"/>
          <rect x="17" y="24" width="16" height="18" rx="6" fill="#f97316"/>
          <line x1="31" y1="29" x2="45" y2="23" stroke="#fcd9b6" stroke-width="4" stroke-linecap="round"/>
          <circle cx="26" cy="16" r="8" fill="#fcd9b6"/>
          <path d="M17 15 Q26 2 35 15Z" fill="#dc2626"/>
          <circle cx="29" cy="17" r="1.4" fill="#0f172a"/>
        </svg>`),
      tractor: createSVGDataURI(`

    // ================= SOUND (Web Audio) =================
    class SoundEngine {
      constructor() { this.ctx = null; this.master = null; this.muted = false; this.bgmTimer = null; this.step = 0; this.rush = false; }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.9;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      tone(freq, type, dur, vol = 0.1, delay = 0, slideTo = null) {
        if (this.muted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(g); g.connect(this.master);
          osc.start(t); osc.stop(t + dur + 0.02);
        } catch (e) {}
      }
      noise(dur, vol = 0.2) {
        if (this.muted || !this.ctx) return;
        const len = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = this.ctx.createBufferSource(), g = this.ctx.createGain();
        g.gain.value = vol; src.buffer = buf; src.connect(g); g.connect(this.master); src.start();
      }
      pickup() { this.tone(523, 'sine', 0.1, 0.15); this.tone(1046, 'sine', 0.15, 0.15, 0.06); }
      deliver(combo = 1) {
        const k = Math.pow(1.122, combo - 1); // each combo step = one tone higher
        [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => this.tone(f * k, 'triangle', 0.2, 0.18, i * 0.06));
      }
      coin() { this.tone(988, 'square', 0.08, 0.06); this.tone(1319, 'square', 0.2, 0.06, 0.08); }
      hit() { this.noise(0.25, 0.25); this.tone(140, 'sawtooth', 0.35, 0.22, 0, 50); }
      slip() { this.tone(900, 'sine', 0.45, 0.15, 0, 150); }
      fail() { [392, 370, 349, 311].forEach((f, i) => this.tone(f, 'sawtooth', 0.22, 0.06, i * 0.16)); }
      alert() { this.tone(330, 'square', 0.1, 0.05); this.tone(247, 'square', 0.14, 0.05, 0.12); }
      click() { this.tone(700, 'sine', 0.04, 0.08); }
      tick() { this.tone(1200, 'square', 0.03, 0.04); }
      // ---- WhatsApp intro: original bouncy tune + chat sounds ----
      introStart() {
        this.init();
        if (this.introTimer) return;
        const n = (m) => 440 * Math.pow(2, (m - 69) / 12);
        // C major "oom-pah" with a cheeky melody (MIDI notes, 0 = rest)
        const mel = [72, 76, 79, 76, 81, 79, 76, 0, 77, 81, 79, 77, 76, 74, 72, 0, 74, 77, 81, 77, 79, 77, 76, 74, 76, 79, 84, 79, 84, 0, 83, 0];
        const bass = [48, 43, 48, 43, 53, 48, 43, 43];
        let step = 0;
        const tick = () => {
          if (!this.muted) {
            const m = mel[step % mel.length];
            if (m) { this.tone(n(m), 'triangle', 0.14, 0.07); this.tone(n(m + 12), 'sine', 0.06, 0.02); }
            if (step % 2 === 0) this.tone(n(bass[(step / 2) % bass.length] + (step % 4 === 2 ? 7 : 0)), 'sine', 0.18, 0.09);
            if (step % 4 === 2) this.noise(0.04, 0.05);
          }
          step++;
          this.introTimer = setTimeout(tick, 170);
        };
        tick();
      }
      introStop() { clearTimeout(this.introTimer); this.introTimer = null; }
      msgPop() { this.tone(988, 'sine', 0.06, 0.12); this.tone(1480, 'sine', 0.09, 0.1, 0.05); }
      boing() { this.tone(180, 'sine', 0.35, 0.2, 0, 900); this.tone(900, 'sine', 0.3, 0.12, 0.3, 260); }
      laugh() { [700, 560, 700, 520].forEach((f, i) => this.tone(f, 'square', 0.06, 0.035, i * 0.08)); }

      match() { [784, 988, 1319].forEach((f, i) => this.tone(f, 'triangle', 0.16, 0.16, i * 0.07)); }
      newRequest() { this.tone(587.33, 'sine', 0.12, 0.12); this.tone(880, 'sine', 0.18, 0.14, 0.09); }
      gift() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 'sine', 0.12, 0.1, i * 0.05)); }
      rushStart() { [440, 554, 659, 880].forEach((f, i) => this.tone(f, 'square', 0.12, 0.06, i * 0.08)); }
      end() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.tone(f, 'triangle', 0.25, 0.15, i * 0.12)); }

      // Original little "freygish" loop (melody + bass), speeds up during the rush
      startBGM() {
        this.init();
        if (this.bgmTimer) return;
        const N = { E4: 329.63, F4: 349.23, Gs4: 415.3, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25 };
        const mel = [N.E4, 0, N.Gs4, N.A4, N.B4, 0, N.A4, N.Gs4, N.A4, 0, N.C5, N.B4, N.A4, N.Gs4, N.F4, N.E4,
                     N.A4, 0, N.C5, N.D5, N.E5, 0, N.D5, N.C5, N.B4, N.C5, N.B4, N.A4, N.Gs4, 0, N.E4, 0];
        const bass = [164.81, 110, 146.83, 164.81, 110, 146.83, 123.47, 164.81];
        const loop = () => {
          if (!this.muted && !document.hidden) {
            const f = mel[this.step % mel.length];
            if (f) this.tone(f, 'triangle', 0.16, 0.035);
            if (this.step % 4 === 0) this.tone(bass[(this.step / 4) % bass.length], 'sine', 0.3, 0.07);
            if (this.step % 2 === 1) this.tone(6000, 'square', 0.015, 0.006);
          }
          this.step++;
          this.bgmTimer = setTimeout(loop, this.rush ? 120 : 165);
        };
        loop();
      }
      stopBGM() { clearTimeout(this.bgmTimer); this.bgmTimer = null; this.rush = false; }
    }

        for (let i = 0; i < 40; i++) {
          const x = rnd.between(0, W), y = rnd.pick([rnd.between(10, 140), rnd.between(460, 590)]);
          g.fillStyle(rnd.pick([0xfde047, 0xf9a8d4, 0xffffff, 0xc084fc]), 1).fillCircle(x, y, 2.5);
        }
        // sidewalks with tiles
        g.fillStyle(0x94a3b8).fillRect(0, 148, W, 55).fillRect(0, 397, W, 55);
        g.lineStyle(1, 0x64748b, 0.6);
        for (let x = 0; x <= W; x += 32) { g.lineBetween(x, 148, x, 203); g.lineBetween(x, 397, x, 452); }
        g.lineBetween(0, 175, W, 175); g.lineBetween(0, 424, W, 424);
        // road
        g.fillStyle(0x334155).fillRect(0, 205, W, 190);
        g.fillStyle(0x2b3646);
        for (let i = 0; i < 70; i++) g.fillCircle(rnd.between(0, W), rnd.between(210, 390), rnd.between(2, 6));
        // dashed center line
        g.fillStyle(0xf8fafc, 0.7);
        for (let x = 10; x < W; x += 70) g.fillRect(x, 298, 40, 5);
        // crosswalk near home/Toledo
        g.fillStyle(0xf8fafc, 0.85);
        for (let y = 214; y < 390; y += 22) g.fillRect(161, y, 50, 12);
        // red/white curbs
        for (let x = 0; x < W; x += 30) {
          const c = (x / 30) % 2 === 0 ? 0xdc2626 : 0xf8fafc;
          g.fillStyle(c).fillRect(x, 202, 30, 5).fillRect(x, 393, 30, 5);
        }

        // swaying cypress trees
        [4, 186, 368, 550, 732, 914, 1096].forEach((tx, i) => {
          [{ y: 140, d: 2 }, { y: 600, d: 600 }].forEach(({ y, d }) => {
            const t = this.add.image(tx, y, 'tree_cypress').setOrigin(0.5, 0.95).setScale(1.05).setDepth(d);
            this.tweens.add({ targets: t, angle: { from: -2, to: 2 }, duration: 1600 + i * 170, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
          });
        });
      }

      createHouse(data) {
        const sprite = this.add.image(data.x, data.y, data.spriteKey).setDepth(1).setScale(0.88)
          .setInteractive({ useHandCursor: true });
        const aura = this.add.circle(data.x, data.y, 58, data.isToledo ? 0xfacc15 : 0x38bdf8, 0.5).setDepth(0).setVisible(!!data.isToledo);
        this.tweens.add({ targets: aura, scale: { from: 0.9, to: 1.35 }, alpha: { from: data.isToledo ? 0.25 : 0.55, to: 0 }, duration: data.isToledo ? 1800 : 900, repeat: -1 });

        const labelY = data.side === 'N' ? data.y + 64 : data.y - 66;
        const label = this.add.text(data.x, labelY, data.name, hebText(12, data.isToledo ? '#fde047' : '#f8fafc', {
          backgroundColor: '#0f172a99', padding: { x: 6, y: 2 },
        })).setOrigin(0.5).setDepth(2);

        const by = data.y - 6;
        const bubble = this.add.container(data.x, by).setDepth(1000).setVisible(false);
        const bubbleBg = this.add.circle(0, 0, 25, 0xffffff).setStrokeStyle(3, 0x3b82f6);
        const itemIcon = this.add.text(0, 0, '', { fontSize: '26px', padding: { x: 2, y: 4 } }).setOrigin(0.5);
        const scoreBadge = this.add.text(0, -34, '+100', hebText(12, '#0f172a', { backgroundColor: '#facc15', padding: { x: 5, y: 2 }, rtl: false })).setOrigin(0.5);
        const barBg = this.add.rectangle(0, 33, 52, 7, 0x0f172a, 0.85).setStrokeStyle(1, 0xffffff, 0.6);
        const barFill = this.add.rectangle(-25, 33, 50, 5, 0x22c55e).setOrigin(0, 0.5);
        const glow = this.add.circle(0, 0, 36, 0x22c55e, 0.55).setVisible(false);
        this.tweens.add({ targets: glow, scale: { from: 0.85, to: 1.35 }, alpha: { from: 0.7, to: 0 }, duration: 650, repeat: -1 });
        const match = this.add.text(0, 50, '💚 יש לך!', hebText(14, '#ffffff', { backgroundColor: '#16a34a', padding: { x: 7, y: 3 }, stroke: '#052e16', strokeThickness: 2 })).setOrigin(0.5).setVisible(false);
        this.tweens.add({ targets: match, y: 57, duration: 320, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
        const rival = this.add.text(28, -18, '🏃', { fontSize: '18px', padding: { x: 1, y: 3 } }).setOrigin(0.5).setVisible(false);
        bubble.add([glow, bubbleBg, itemIcon, scoreBadge, barBg, barFill, match, rival]);
        this.tweens.add({ targets: bubble, y: by - 5, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.inOut' });

        const h = {
          ...data, sprite, label, aura, bubble, glow, bubbleBg, itemIcon, scoreBadge, barFill, match, rival, bubbleY: by,
          doorX: data.x, doorY: data.side === 'N' ? DOOR_N : DOOR_S, currentRequest: null, isPlayerHome: false,
        };
        // Choosing your home: tap a house while the "pick your house" banner is up
        sprite.on('pointerover', () => { if (this.pickMode) sprite.setScale(0.96); });
        sprite.on('pointerout', () => sprite.setScale(0.88));
        sprite.on('pointerup', () => this.onHouseClick(h));
        return h;
      }

      homeHouse() { return this.houses.find(h => h.isPlayerHome); }

      applyHome(id) {
        this.houses.forEach(h => {
          h.isPlayerHome = h.id === id;
          h.sprite.setTexture(h.isPlayerHome ? 'house_player' : h.spriteKey);
          h.label.setText(h.isPlayerHome ? `🏠 ${h.family} · הבית שלך` : h.name)
            .setBackgroundColor(h.isPlayerHome ? '#1d4ed8dd' : '#0f172a99');
        });
      }

      onHouseClick(h) {
        if (store.s.overlay !== 'pickHouse') return;
        if (h.isToledo) {
          sound.fail(); buzz([30, 30, 30]);
          this.tweens.add({ targets: h.sprite, angle: { from: -4, to: 4 }, duration: 70, yoyo: true, repeat: 3, onComplete: () => h.sprite.setAngle(0) });
          this.speech(h, 'רק אחד! ☝️');
          return toast(pick(TOLEDO_JOKES()), 'gold');
        }
        Game.chooseHome(h.id);
      }

      moveIntoHome(h) {
        this.applyHome(h.id);
        sound.deliver(1); buzz(25);
        this.burst.explode(30, h.x, h.y - 20);
        this.tweens.add({ targets: h.sprite, scaleX: 0.98, scaleY: 0.8, duration: 110, yoyo: true, repeat: 1 });
        const p = this.player;
        const outY = h.doorY + (h.side === 'N' ? 18 : -18);
        p.setFlipX(h.doorX < p.x);
        this.tweens.add({ targets: p, x: h.doorX, y: outY, duration: 650, ease: 'Sine.inOut',
          onComplete: () => this.tweens.add({ targets: p, y: h.doorY, alpha: 0, scale: 0.5, duration: 220, yoyo: true, hold: 250 }) });
      }

      // ---------- main loop ----------
      update(time, delta) {
        const dt = Math.min(delta, 50) / 1000;
        this.updateVehicles(time, dt);
        this.nameTag.setPosition(this.player.x, this.player.y - 36).setAlpha(this.player.alpha);
        const picking = store.s.overlay === 'pickHouse';
        if (picking !== this.pickMode) {
          this.pickMode = picking;
          this.houses.forEach(h => { if (!h.isToledo) h.aura.setVisible(picking || !!h.currentRequest); });
        }

        const phase = store.s.phase;
        const running = phase === 'PLAYING' || phase === 'TOLEDO';
        if (!running) { this.player.setVelocity(0, 0); this.prompt.setVisible(false); this.aiRunners.setVelocity(0, 0); return; }

        // --- clock ---
        this.elapsed += dt;
        const left = Math.max(0, ROUND_SECONDS - this.elapsed);
        const leftSec = Math.ceil(left);
        if (leftSec !== store.s.timeLeft) {
          store.set({ timeLeft: leftSec });
          if (leftSec <= 10 && leftSec > 0) sound.tick();
        }
        if (!store.s.rush && left <= RUSH_SECONDS) this.startRush();
        this.dusk.setAlpha(Math.min(0.2, (this.elapsed / ROUND_SECONDS) * 0.2));
        if (left <= 0) return this.endGame();

        // --- spawners: get busier as the round goes on ---
        const progress = this.elapsed / ROUND_SECONDS;
        this.reqTimer -= dt;
        if (this.reqTimer <= 0) {
          this.spawnHouseRequest();
          this.reqTimer = store.s.rush ? 3 : Phaser.Math.Linear(6.5, 4, progress);
        }

        this.updatePlayer(time, dt, phase);
        this.updateRequests(dt);
        this.updateGuide(time);
        this.updateRivals(dt);
        this.updateGroundItems(time);
        if (phase === 'PLAYING') this.updateProximity();
        else this.prompt.setVisible(false);

        if (phase === 'TOLEDO' && this.toledoWait > 0) {
          this.toledoWait -= dt;
          const w = Math.max(0, Math.ceil(this.toledoWait));
          if (w !== store.s.toledoWait) store.set({ toledoWait: w });
        }

        // keyboard action
        if (this.actionKeys.some(k => Phaser.Input.Keyboard.JustDown(k))) this.handleAction();
      }

      updatePlayer(time, dt, phase) {
        const p = this.player;
        if (this.invuln > 0) {
          this.invuln -= dt * 1000;
          p.setAlpha(this.invuln > 0 && Math.floor(time / 90) % 2 ? 0.45 : 1);
        }
        if (this.stun > 0 || phase === 'TOLEDO') {
          this.stun -= dt * 1000;
          p.setVelocity(0, 0);
          return;
        }
        let vx = 0, vy = 0;
        if (this.cursors.left.isDown || this.wasd.A.isDown) vx -= 1;
        if (this.cursors.right.isDown || this.wasd.D.isDown) vx += 1;
        if (this.cursors.up.isDown || this.wasd.W.isDown) vy -= 1;
        if (this.cursors.down.isDown || this.wasd.S.isDown) vy += 1;
        const stick = window.virtualStick;
        if (stick && (stick.x || stick.y)) { vx = stick.x; vy = stick.y; }
        const len = Math.hypot(vx, vy);
        if (len > 1) { vx /= len; vy /= len; }

        // heavy items slow you down
        const inv = store.s.inventory;
        const extraWeight = inv.reduce((a, i) => a + (i.weight - 1), 0);
        const speed = 250 - inv.length * 8 - extraWeight * 35;
        p.setVelocity(vx * speed, vy * speed);
        if (p.y < PLAYER_MIN_Y) p.y = PLAYER_MIN_Y;
        if (p.y > PLAYER_MAX_Y) p.y = PLAYER_MAX_Y;
        p.setDepth(p.y);

        // little walk wobble + dust
        if (len > 0.1) {
          this.walkClock += dt * 14;
          p.setAngle(Math.sin(this.walkClock) * 7);
          if (vx) p.setFlipX(vx < 0);
          if (Math.random() < 0.25) this.dust.emitParticleAt(p.x, p.y + 24, 1);
        } else {
          p.setAngle(0);
        }
      }

      updateRequests(dt) {
        const inv = store.s.inventory;
        const anyMatch = this.houses.some(h => h.currentRequest && inv.some(i => i.id === h.currentRequest.item.id));
        this.houses.forEach(house => {
          const req = house.currentRequest;
          if (!req) return;
          req.patience -= (100 / req.duration) * dt;
          const pct = Math.max(0, req.patience) / 100;
          house.barFill.setScale(pct, 1);
          house.barFill.fillColor = pct > 0.5 ? 0x22c55e : pct > 0.25 ? 0xf59e0b : 0xef4444;

          const has = inv.some(i => i.id === req.item.id);
          // "You have it!" — green glow, bouncing label, bigger bubble, green house aura; other requests fade back
          house.match.setVisible(has);
          house.glow.setVisible(has);
          house.bubbleBg.setStrokeStyle(has ? 6 : 3, has ? 0x16a34a : (pct < 0.25 ? 0xef4444 : 0x3b82f6));
          house.bubble.setScale(has ? 1.2 : 1).setAlpha(anyMatch && !has ? 0.55 : 1);
          house.aura.setFillStyle(has ? 0x22c55e : 0x38bdf8, has ? 0.75 : 0.5);
          house.bubble.x = house.x + (pct < 0.25 ? (Math.random() - 0.5) * 4 : 0);

          if (req.patience < 75 && !req.aiDispatched && !req.noAI) {
            req.aiDispatched = true;
            this.dispatchAIRunner(house);
          }
          if (req.patience <= 0) this.failRequest(house, `😤 ${house.who} התייאשה מלחכות ל${req.item.name}`);
        });
      }

      // Green arrow beside the player pointing at the nearest house that wants something you carry
      updateGuide(time) {
        const inv = store.s.inventory, p = this.player;
        let best = null, bestD = Infinity;
        const wanted = {};
        this.houses.forEach(h => {
          const r = h.currentRequest;
          if (!r) return;
          if (inv.some(i => i.id === r.item.id)) {
            wanted[r.item.id] = wanted[r.item.id] || h.family;
            const d = Phaser.Math.Distance.Between(p.x, p.y, h.doorX, h.doorY);
            if (d < bestD) { bestD = d; best = h; }
          }
        });
        const key = JSON.stringify(wanted);
        if (key !== this.wantedKey) { this.wantedKey = key; store.set({ wanted }); }
        const show = best && bestD > 110 && this.stun <= 0 && store.s.phase === 'PLAYING';
        this.guide.setVisible(!!show);
        if (show) {
          const a = Phaser.Math.Angle.Between(p.x, p.y, best.doorX, best.doorY);
          const r = 58 + Math.sin(time / 120) * 6;
          this.guide.setPosition(p.x + Math.cos(a) * r, p.y - 8 + Math.sin(a) * r).setRotation(a).setAlpha(0.75 + Math.sin(time / 120) * 0.25);
        }
      }

      updateRivals(dt) {
        this.aiRunners.getChildren().slice().forEach(ai => {
          ai.carry.setPosition(ai.x, ai.y - 40);
          ai.setDepth(ai.y); ai.carry.setDepth(ai.y + 1);
          if (ai.stun > 0) {
            ai.stun -= dt * 1000; ai.setVelocity(0, 0); ai.setAngle(ai.angle + 20);
            return;
          }
          ai.setAngle(Math.sin(this.time.now / 70) * 7);
          const h = ai.targetHouse;
          // request already handled (by player or timeout) → rival gives up
          if (h.currentRequest !== ai.req) return this.removeRival(ai, true);
          const angle = Phaser.Math.Angle.Between(ai.x, ai.y, h.doorX, h.doorY);
          this.physics.velocityFromRotation(angle, 115, ai.body.velocity);
          ai.setFlipX(ai.body.velocity.x < 0);
          if (Phaser.Math.Distance.Between(ai.x, ai.y, h.doorX, h.doorY) < 18) {
            this.failRequest(h, `😱 ${ai.rival.n} ${ai.rival.f ? 'הקדימה' : 'הקדים'} אותך ל${h.who}!`);
            this.removeRival(ai, false);
          }
        });
      }

      updateGroundItems(time) {
        const inv = store.s.inventory;
        this.groundItems = this.groundItems.filter(gi => {
          if (time > gi.expireAt) { gi.obj.destroy(); return false; }
          if (time > gi.expireAt - 3000) gi.obj.setAlpha(Math.floor(time / 150) % 2 ? 0.3 : 1);
          if (time < gi.readyAt || this.stun > 0) return true;
          if (Phaser.Math.Distance.Between(this.player.x, this.player.y + 10, gi.obj.x, gi.obj.y) < 34) {
            if (inv.length >= 3) {
              if (time > this.fullHintAt) { toast(`התיק מלא! ${G('זרוק', 'זרקי')} חפץ (✕) כדי להרים.`, 'bad'); this.fullHintAt = time + 3000; }
              return true;
            }
            this.addToInventory(gi.item, `הרמת מהרצפה: ${gi.item.icon} ${gi.item.name}`);
            gi.obj.destroy();
            return false;
          }
          return true;
        });
      }

      updateProximity() {
        const p = this.player;
        const near = this.houses.find(h => Phaser.Math.Distance.Between(p.x, p.y, h.doorX, h.doorY) < 64);
        const kind = !near ? null : near.isToledo ? 'toledo' : near.isPlayerHome ? 'home' : near.currentRequest ? 'request' : null;
        if (kind !== store.s.near) store.set({ near: kind });

        if (kind === 'toledo' || kind === 'home') {
          const label = kind === 'toledo' ? '👑 להיכנס לטולדו' : '🏠 לקחת מהבית';
          this.prompt.setText(IS_TOUCH ? label : `${label} [Space]`).setPosition(p.x, p.y - 50).setVisible(true);
        } else {
          this.prompt.setVisible(false);
        }

        // Auto-deliver when you reach a house carrying what it needs; otherwise a one-time hint
        if (kind === 'request' && this.stun <= 0) {
          const req = near.currentRequest;
          if (store.s.inventory.some(i => i.id === req.item.id)) this.fulfillRequest(near);
          else if (this.hintedReq !== req) { this.hintedReq = req; this.showMissingHint(near); }
        }
      }

      updateVehicles(time, dt) {
        const phase = store.s.phase;
        this.vehTimer -= dt;
        if (this.vehTimer <= 0) {
          this.spawnVehicle();
          const progress = (this.elapsed || 0) / ROUND_SECONDS;
          this.vehTimer = phase === 'START' ? 2.5 : Phaser.Math.Linear(2.8, 1.5, progress);
        }
        // Old bug: vehicles were never removed, so after 3 had driven off-screen traffic stopped forever
        this.vehicles.getChildren().slice().forEach(v => {
          if (v.cfg.zigzag) v.setVelocityY(Math.sin(time / 260 + v.seed) * 90);
          if (v.y < 222) v.y = 222;
          if (v.y > 378) v.y = 378;
          v.setDepth(v.y);
          const off = v.x < -140 || v.x > W + 140;
          const expired = v.cfg.obstacle && time > v.expireAt;
          if (off || expired) {
            if (expired) this.tweens.add({ targets: v, alpha: 0, duration: 300, onComplete: () => v.destroy() });
            else v.destroy();
          }
        });
      }

      // ---------- spawning ----------
      spawnVehicle() {
        if (this.vehicles.getLength() >= 5) return;
        const cfg = pick(VEHICLES);
        if (cfg.obstacle && this.vehicles.getChildren().filter(v => v.cfg.obstacle).length >= 2) return;
        const dir = Math.random() > 0.5 ? 1 : -1;
        let x, y;
        if (cfg.obstacle) {
          x = 260 + Math.random() * (W - 380);
          y = 235 + Math.random() * 130;
        } else {
          x = dir === 1 ? -100 : W + 100;
          y = (dir === 1 ? 345 : 258) + (Math.random() - 0.5) * 30; // right-hand traffic lanes
        }
        const v = this.vehicles.create(x, y, cfg.key);
        v.cfg = cfg; v.seed = Math.random() * 10;
        v.body.setSize(v.width * 0.72, v.height * 0.4).setOffset(v.width * 0.14, v.height * 0.55);
        if (cfg.obstacle) {
          v.body.setImmovable(true);
          v.expireAt = this.time.now + 14000;
          v.setScale(0); this.tweens.add({ targets: v, scale: 1, duration: 300, ease: 'Back.out' });
        } else {
          v.setVelocityX(cfg.speed * dir * Phaser.Math.FloatBetween(0.9, 1.15));
          v.setFlipX(dir === -1);
          if (cfg.key === 'cow') this.tweens.add({ targets: v, angle: { from: -3, to: 3 }, duration: 300, yoyo: true, repeat: -1 });
        }
      }

      spawnHouseRequest(itemToRequest = null, opts = {}) {
        const active = this.houses.filter(h => h.currentRequest).length;
        if (active >= 4) return;
        const eligible = this.houses.filter(h => !h.isPlayerHome && !h.isToledo && !h.currentRequest);
        if (!eligible.length) return;

        const house = pick(eligible);
        const item = itemToRequest || pick(ITEM_LIST);
        const progress = this.elapsed / ROUND_SECONDS;
        house.currentRequest = {
          item, patience: 100,
          duration: opts.duration || Phaser.Math.Linear(26, 19, progress) - (item.points >= 150 ? 2 : 0),
          aiDispatched: false, noAI: !!opts.noAI,
        };
        house.itemIcon.setText(item.icon);
        house.scoreBadge.setText(`+${item.points * (store.s.rush ? 2 : 1)}`);
        house.rival.setVisible(false);
        house.bubble.setVisible(true).setScale(0);
        this.tweens.add({ targets: house.bubble, scale: 1, duration: 350, ease: 'Back.out' });
        house.aura.setVisible(true);
        this.speech(house, item.ask);
        if (store.s.inventory.some(i => i.id === item.id)) {
          sound.match();
          toast(`💚 יש לך ${item.icon} ${item.name}! ${house.who} צריכה — ${G('רוץ', 'רוצי')}!`, 'good');
        } else sound.newRequest();
      }

      speech(house, text) {
        const y = house.side === 'N' ? house.bubbleY + 70 : house.bubbleY - 70;
        const t = this.add.text(house.x, y, text, hebText(13, '#0f172a', { backgroundColor: '#ffffff', padding: { x: 7, y: 4 } }))
          .setOrigin(0.5).setDepth(1100).setScale(0);
        this.tweens.add({ targets: t, scale: 1, duration: 200, ease: 'Back.out' });
        this.tweens.add({ targets: t, alpha: 0, delay: 2200, duration: 400, onComplete: () => t.destroy() });
      }

      dispatchAIRunner(house) {
        const sources = this.houses.filter(h => h.id !== house.id && !h.isPlayerHome && !h.isToledo);
        const src = pick(sources);
        const ai = this.aiRunners.create(src.doorX, src.doorY, `ai_${Math.floor(Math.random() * 4)}`).setScale(0.8);
        ai.body.setSize(30, 18).setOffset(13, 44);
        ai.targetHouse = house; ai.req = house.currentRequest; ai.stun = 0;
        ai.rival = pick(RIVALS);
        ai.carry = this.add.text(ai.x, ai.y - 40, house.currentRequest.item.icon, { fontSize: '20px', padding: { x: 1, y: 3 } }).setOrigin(0.5);
        house.rival.setVisible(true);
        this.tweens.add({ targets: house.rival, scale: { from: 1.6, to: 1 }, duration: 300 });
        sound.alert();
        toast(`⚠️ ${ai.rival.n} ${ai.rival.f ? 'רצה' : 'רץ'} להביא ${house.currentRequest.item.icon} ל${house.who}!`, 'bad');
      }

      removeRival(ai, sulk) {
        if (sulk) this.popText(ai.x, ai.y - 30, '😤', '#ffffff', 26);
        ai.carry.destroy();
        ai.destroy();
      }

      // ---------- interactions ----------
      handleVehicleCollision(player, vehicle) {
        if (store.s.phase !== 'PLAYING' || this.stun > 0 || this.invuln > 0) return;
        const isBamba = vehicle.cfg.obstacle;
        if (isBamba) sound.slip(); else sound.hit();
        buzz([60, 40, 60]);
        addStat('hits');
        this.stun = isBamba ? 1000 : 1200;
        this.invuln = this.stun + 1300;
        this.cameras.main.shake(220, 0.012);
        this.cameras.main.flash(120, 255, 80, 80);
        this.tweens.add({ targets: player, angle: 720, duration: this.stun, onComplete: () => player.setAngle(0) });
        this.popText(player.x, player.y - 45, '💫', '#ffffff', 30);

        const inv = store.s.inventory;
        inv.forEach(item => {
          const a = Math.random() * Math.PI * 2, r = 45 + Math.random() * 30;
          this.spawnGroundItem(item, player.x, player.y, player.x + Math.cos(a) * r, Phaser.Math.Clamp(player.y + Math.sin(a) * r, PLAYER_MIN_Y, PLAYER_MAX_Y), 1400);
        });
        store.set({ inventory: [] });
        toast(isBamba
          ? '🍿 החלקת על במבה! החפצים התפזרו — אסוף אותם.'
          : `💥 נפגעת מ${vehicle.cfg.name}! החפצים התפזרו — אסוף אותם.`, 'bad');
      }

      handleRivalHit(ai, vehicle) {
        if (ai.stun > 0) return;
        ai.stun = 1300;
        this.popText(ai.x, ai.y - 40, '💫', '#ffffff', 24);
      }

      handleAction() {
        const s = store.s;
        if (s.phase !== 'PLAYING' || this.stun > 0) return;
        const p = this.player;
        const h = this.houses.find(h => Phaser.Math.Distance.Between(p.x, p.y, h.doorX, h.doorY) < 64);
        if (!h) { toast(`🚶 ${G('גש', 'גשי')} לדלת של בית כדי לפעול`, 'info'); return; }
        sound.click();
        if (h.isToledo) return this.openToledo();
        if (h.isPlayerHome) return this.restockAtHome();
        if (h.currentRequest) this.showMissingHint(h);
      }

      showMissingHint(house) {
        const it = house.currentRequest.item;
        const where = it.basic ? 'יש כזה בבית שלך 🏠' : 'רק לטולדו 👑 יש (למעלה משמאל)';
        toast(`${house.who} צריכה ${it.icon} ${it.name} — ${where}`, 'info');
      }

      fulfillRequest(house) {
        const s = store.s;
        const req = house.currentRequest;
        const idx = s.inventory.findIndex(i => i.id === req.item.id);
        const inv = [...s.inventory]; inv.splice(idx, 1);

        const fast = req.patience > 70;
        const mult = s.combo * (s.rush ? 2 : 1);
        const points = Math.round(req.item.points * mult * (fast ? 1.2 : 1));
        const newCombo = Math.min(s.combo + 1, 4);
        store.set(st => ({
          inventory: inv, score: st.score + points, favors: st.favors + 1, combo: newCombo,
          stats: { ...st.stats, deliveries: st.stats.deliveries + 1, bestCombo: Math.max(st.stats.bestCombo, newCombo) },
        }));

        sound.deliver(s.combo); sound.coin(); buzz(25);
        this.burst.explode(30, house.x, house.bubbleY);
        this.tweens.add({ targets: house.sprite, scaleX: 1.1, scaleY: 0.9, duration: 90, yoyo: true, repeat: 1 });
        this.popText(house.x, house.bubbleY - 20, `+${points}`, '#fde047', 30);
        this.popText(house.x + 46, house.bubbleY - 6, '⭐+1', '#c4b5fd', 16);
        if (fast) this.popText(house.x - 50, house.bubbleY - 6, '⚡מהיר!', '#67e8f9', 16);
        if (newCombo > s.combo) this.popText(W / 2, 300, `x${newCombo} קומבו! 🔥`, '#f472b6', 46);

        this.clearRequest(house);
        toast(`✨ הבאת ל${house.who} ${req.item.icon} ${req.item.name}!`, 'good');

        // Neighbor attic gift
        if (Math.random() < 0.35) {
          const gift = pick(ITEM_LIST.filter(i => !i.basic));
          this.time.delayedCall(450, () => {
            this.spawnGroundItem(gift, house.x, house.y, house.doorX + (Math.random() > 0.5 ? 40 : -40), house.doorY + (house.side === 'N' ? 20 : -20), 600);
            sound.gift();
            toast(`🎁 ${house.who} זרקה לך ${gift.icon} ${gift.name} מהבוידעם!`, 'gold');
          });
        }
      }

      failRequest(house, msg) {
        this.clearRequest(house);
        this.popText(house.x, house.bubbleY, '💢', '#ffffff', 34);
        sound.fail();
        const lostCombo = store.s.combo > 1;
        store.set(st => ({ combo: 1, stats: { ...st.stats, missed: st.stats.missed + 1 } }));
        toast(msg + (lostCombo ? ' (הקומבו התאפס)' : ''), 'bad');
      }

      clearRequest(house) {
        house.currentRequest = null;
        house.bubble.setVisible(false);
        house.aura.setVisible(false);
      }

      spawnGroundItem(item, fromX, fromY, toX, toY, readyDelay) {
        const obj = this.add.container(fromX, fromY).setDepth(toY - 1);
        obj.add([
          this.add.ellipse(0, 14, 28, 8, 0x000000, 0.3),
          this.add.circle(0, 0, 17, 0xffffff, 0.9).setStrokeStyle(2, item.basic ? 0x38bdf8 : 0xfacc15),
          this.add.text(0, 0, item.icon, { fontSize: '20px', padding: { x: 1, y: 3 } }).setOrigin(0.5),
        ]);
        this.tweens.add({ targets: obj, x: toX, duration: 500, ease: 'Quad.out' });
        this.tweens.add({ targets: obj, y: toY, duration: 500, ease: 'Bounce.out' });
        const now = this.time.now;
        this.groundItems.push({ obj, item, readyAt: now + readyDelay, expireAt: now + 16000 });
      }

      dropFromInventory(idx) {
        const inv = [...store.s.inventory];
        const [item] = inv.splice(idx, 1);
        if (!item) return;
        store.set({ inventory: inv });
        const p = this.player;
        this.spawnGroundItem(item, p.x, p.y, p.x + (Math.random() > 0.5 ? 36 : -36), p.y + 14, 1500);
        toast(`זרקת ${item.icon} ${item.name} לרחוב`, 'info');
      }

      addToInventory(item, msg) {
        if (store.s.inventory.length >= 3) return;
        store.set(st => ({ inventory: [...st.inventory, item] }));
        sound.pickup(); buzz(15);
        this.popText(this.player.x, this.player.y - 46, item.icon, '#ffffff', 26);
        const waiting = this.houses.find(h => h.currentRequest?.item.id === item.id);
        if (waiting) { sound.match(); toast(`${msg ? msg + ' · ' : ''}💚 ${waiting.who} מחכה לזה!`, 'good'); }
        else if (msg) toast(msg, 'good');
      }

      restockAtHome() {
        const inv = store.s.inventory;
        if (inv.length >= 3) return toast(`התיק מלא! ${G('זרוק', 'זרקי')} חפץ (✕) כדי לפנות מקום.`, 'bad');
        // Smart restock: grab a basic item someone is actually waiting for
        const wanted = this.houses.map(h => h.currentRequest?.item).filter(i => i && i.basic && !inv.some(x => x.id === i.id));
        const item = wanted[0] || pick(BASICS);
        const h = this.homeHouse(), p = this.player, backY = p.y;
        this.stun = 520; // in and out of the front door
        this.tweens.add({ targets: p, x: h.doorX, y: h.doorY, alpha: 0, scale: 0.5, duration: 200, yoyo: true, hold: 140,
          onComplete: () => { p.setAlpha(1).setScale(0.85); p.y = backY; } });
        // (not onYoyo — Phaser fires that once per tweened property)
        this.time.delayedCall(270, () => this.addToInventory(item, `לקחת מהבית: ${item.icon} ${item.name}`));
      }

      openToledo() {
        this.toledoWait = 3;
        store.set({ phase: 'TOLEDO', toledoWait: 3 });
      }

      startRush() {
        store.set({ rush: true });
        sound.rush = true; sound.rushStart();
        this.popText(W / 2, 270, '🔥 שעת לחץ! נקודות כפולות', '#fb923c', 40);
        this.houses.forEach(h => h.currentRequest && h.scoreBadge.setText(`+${h.currentRequest.item.points * 2}`));
      }

      popText(x, y, str, color, size) {
        const t = this.add.text(x, y, str, hebText(size, color, { rtl: HEB.test(str), stroke: '#0f172a', strokeThickness: Math.max(3, size / 7), padding: { x: 4, y: 6 } }))
          .setOrigin(0.5).setDepth(2500).setScale(0.3);
        this.tweens.add({ targets: t, scale: 1, duration: 220, ease: 'Back.out' });
        this.tweens.add({ targets: t, y: y - 50, alpha: 0, delay: 500, duration: 650, onComplete: () => t.destroy() });
      }

      endGame() {
        const s = store.s;
        let best = 0;
        try { best = Number(localStorage.getItem('cypress_best') || 0); } catch (e) {}
        const isRecord = s.score > best;
        if (isRecord) { try { localStorage.setItem('cypress_best', String(s.score)); } catch (e) {} }
        store.set({ phase: 'OVER', near: null, final: { score: s.score, best: Math.max(best, s.score), isRecord, ...s.stats } });
        Board.submit({ name: s.profile.name, score: s.score, deliveries: s.stats.deliveries, combo: s.stats.bestCombo, look: s.profile.look, pid: s.profile.pid });
        this.player.setVelocity(0, 0);
        sound.stopBGM(); sound.end();
        if (isRecord) for (let i = 0; i < 4; i++) this.time.delayedCall(i * 250, () => this.burst.explode(40, 200 + Math.random() * 600, 300));
      }
    }

    // ================= GAME API (React → Phaser) =================
    const Game = {
      scene: () => window.__game?.scene?.getScene('MainScene'),
      async start() {
        if (!store.s.profile.home) return store.set({ overlay: 'pickHouse' }); // pick your house first
        requestFullScreenMode();               // must run synchronously inside the tap
        sound.init(); sound.stopBGM(); sound.startBGM();
        store.set({ overlay: null });
        await refreshPlayerTexture();
        const shuffled = [...ITEM_LIST].sort(() => Math.random() - 0.5);
        const [i1, i2] = shuffled;
        store.set({
          phase: 'PLAYING', score: 0, favors: 1, combo: 1, timeLeft: ROUND_SECONDS, inventory: [i1, i2],
          toast: null, near: null, rush: false, final: null, toledoWait: 0,
          stats: { deliveries: 0, bestCombo: 1, missed: 0, hits: 0 }, submit: null,
        });
        const sc = this.scene(); if (sc) sc.elapsed = 0;
        // Restart the scene so leftovers from the previous round (requests, rivals, items) are cleared
        sc?.scene.restart({ firstItem: i1 });
      },
      chooseHome(id) {
        const profile = { ...store.s.profile, home: id };
        ls.set('cypress_profile', profile);
        store.set({ profile });
        const h = this.scene()?.houses.find(x => x.id === id);
        if (h) this.scene().moveIntoHome(h);
        toast(`🏠 ברוכים הבאים הביתה! גרים עכשיו אצל ${houseById(id).who}`, 'good');
        setTimeout(() => { if (store.s.overlay === 'pickHouse') store.set({ overlay: null }); }, 1500);
      },
      action() { this.scene()?.handleAction(); },
      drop(idx) { sound.click(); this.scene()?.dropFromInventory(idx); },
      skipToledo() {
        if (store.s.favors < 1) return;
        sound.coin();
        const sc = this.scene(); if (sc) sc.toledoWait = 0;
        store.set(s => ({ favors: s.favors - 1, toledoWait: 0 }));
      },
      pickToledo(item) {
        if (store.s.inventory.length >= 3) return toast('התיק מלא!', 'bad');
        this.scene()?.addToInventory(item, `לקחת מטולדו: ${item.icon} ${item.name}`);
        if (store.s.inventory.length >= 3) this.closeToledo();
      },
      closeToledo() { sound.click(); if (store.s.phase === 'TOLEDO') store.set({ phase: 'PLAYING' }); },
    };

    function requestFullScreenMode() {
      const doc = document.documentElement;
      if (CAN_FULLSCREEN && !IS_STANDALONE && !isFullscreen()) {
        const p = doc.requestFullscreen ? doc.requestFullscreen() : doc.webkitRequestFullscreen?.();
        if (p && p.then) p.then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {});
      }
    }

    // Rebuild the player's sprite from the saved look (new key each time so the old sprite never points at a deleted texture)
    let texCounter = 0;
    function refreshPlayerTexture() {
      return new Promise(resolve => {
        const game = window.__game;
        if (!game) return resolve();
        const img = new Image();
        img.onload = () => {
          const key = 'player_' + (++texCounter);
          game.textures.addImage(key, img);
          PLAYER_KEY = key;
          const sc = Game.scene();
          if (sc && sc.player) { sc.player.setTexture(key); sc.nameTag.setText(store.s.profile.name); }
          resolve();
        };
        img.onerror = () => resolve();
        img.src = person(store.s.profile.look);
      });
    }

    // ================= LEADERBOARD (Firestore REST API — no SDK needed) =================
    const Board = {
      remote: !!(FIREBASE.apiKey && FIREBASE.projectId),
      base: () => `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents`,
      localRows() { return ls.get('cypress_local_scores', []); },
      addLocal(e) {
        const rows = [...this.localRows(), e].sort((a, b) => b.score - a.score).slice(0, 20);
        ls.set('cypress_local_scores', rows);
      },
      toDoc(e) {
        return { fields: {
          name: { stringValue: e.name }, score: { integerValue: String(e.score) },
          deliveries: { integerValue: String(e.deliveries) }, combo: { integerValue: String(e.combo) },
          avatar: { stringValue: JSON.stringify(e.look) }, pid: { stringValue: e.pid }, at: { timestampValue: e.at },
        } };
      },
      fromDoc(d) {
        const f = d.fields || {};
        let look = null; try { look = JSON.parse(f.avatar?.stringValue || 'null'); } catch (e) {}
        return { name: f.name?.stringValue || '?', score: Number(f.score?.integerValue || 0), deliveries: Number(f.deliveries?.integerValue || 0),
          combo: Number(f.combo?.integerValue || 1), look, pid: f.pid?.stringValue, at: f.at?.timestampValue };
      },
      async refresh() {
        store.set(s => ({ board: { ...s.board, status: 'loading' } }));
        if (!this.remote) return store.set({ board: { status: 'ok', rows: this.localRows(), local: true } });
        try {
          const res = await fetch(`${this.base()}:runQuery?key=${FIREBASE.apiKey}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'scores' }], orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: 20 } }),
          });
          if (!res.ok) throw new Error(res.status);
          const rows = (await res.json()).filter(r => r.document).map(r => this.fromDoc(r.document));
          store.set({ board: { status: 'ok', rows, local: false } });
        } catch (e) {
          store.set({ board: { status: 'error', rows: this.localRows(), local: true } });
        }
      },
      async submit(entry) {
        const e = { ...entry, at: new Date().toISOString() };
        store.set({ submit: { status: 'sending', at: e.at } });
        if (e.score > 0) this.addLocal(e);
        if (this.remote && e.score > 0) {
          try {
            const res = await fetch(`${this.base()}/scores?key=${FIREBASE.apiKey}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.toDoc(e)),
            });
            store.set({ submit: { status: res.ok ? 'ok' : 'error', at: e.at } });
          } catch (err) { store.set({ submit: { status: 'error', at: e.at } }); }
        } else {
          store.set({ submit: { status: e.score > 0 ? 'local' : 'skip', at: e.at } });
        }
        this.refresh();
      },
    };

    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => store.set({ fs: isFullscreen() })));

    // ================= REACT UI =================
    const TOAST_STYLES = {
      good: 'border-emerald-400 bg-emerald-950/95',
      bad: 'border-red-400 bg-red-950/95',
      gold: 'border-amber-400 bg-amber-950/95',
      info: 'border-sky-400 bg-slate-900/95',
    };

    // First launch: wizard → customizer. Later launches go straight to the start screen.
    store.s.overlay = !ls.get('cypress_onboarded', false) ? 'wizard' : !savedProfile ? 'custom' : null;

    function Avatar({ look, size = 40 }) {
      const key = JSON.stringify(look || {});
      const src = React.useMemo(() => person(look || {}), [key]);
      return <img src={src} alt="" draggable={false} style={{ width: size, height: size * 64 / 56 }} />;
    }

    function Joystick() {
      const baseRef = useRef(null);
      const [knob, setKnob] = useState({ x: 0, y: 0 });
      const R = 42;
      const move = (e) => {
        const r = baseRef.current.getBoundingClientRect();
        let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy);
        if (d > R) { dx = dx / d * R; dy = dy / d * R; }
        setKnob({ x: dx, y: dy });
        window.virtualStick = Math.hypot(dx, dy) / R < 0.2 ? { x: 0, y: 0 } : { x: dx / R, y: dy / R };
      };
      const end = () => { setKnob({ x: 0, y: 0 }); window.virtualStick = { x: 0, y: 0 }; };
      return (
        <div ref={baseRef}
          onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); move(e); }}
          onPointerMove={(e) => { if (e.currentTarget.hasPointerCapture(e.pointerId)) move(e); }}
          onPointerUp={end} onPointerCancel={end}
          className="joystick pointer-events-auto w-28 h-28 rounded-full bg-slate-900/50 border-2 border-white/25 relative backdrop-blur-sm"
          style={{ touchAction: 'none' }}>
          <div className="absolute w-12 h-12 rounded-full bg-white/75 border-2 border-white shadow-lg"
            style={{ left: '50%', top: '50%', transform: `translate(calc(-50% + ${knob.x}px), calc(-50% + ${knob.y}px))` }} />
        </div>
      );
    }

    function rankFor(score) {
      if (score < 300) return G('מתנדב מתחיל 🌱', 'מתנדבת מתחילה 🌱');
      if (score < 900) return G('חבר קיבוץ מן השורה 🚜', 'חברת קיבוץ מן השורה 🚜');
      if (score < 1800) return G('מזכיר הקיבוץ 📋', 'מזכירת הקיבוץ 📋');
      return 'אגדת רחוב הברוש 👑';
    }

    // ---------- Onboarding wizard (3 steps, skippable, remembered) ----------
    const wizardSteps = () => [
      {
        art: '🏠💬✨', title: 'עוזרים לשכנים',
        lines: [

          '💚 כשיש לך את מה שמבקשים — הבית זוהר בירוק וחץ ירוק מראה לך לאן לרוץ.',
          '🏃 רצים אליו עם החפץ — המסירה אוטומטית!',
          IS_TOUCH ? '🕹️ ג׳ויסטיק משמאל לתנועה, 🖐️ כפתור פעולה מימין.' : '⌨️ חיצים / WASD לתנועה, Space ליד דלת.',
        ],
      },
      {

          '👑 אצל טולדו (למעלה משמאל) יש הכל — אבל קודם קפה של 3 שניות. ⭐ טובה מדלגת.',
        ],
      },
      {

        lines: [
          `🏃 שכנים מתחרים רצים לאותו בית — ${G('תקדים', 'תקדימי')} אותם.`,
          '🛺 קלנועיות, טרקטורים, פרות ו🍿 במבה מפילים לך את החפצים.',
          '🔥 מסירות ברצף = קומבו עד x4, ובחצי הדקה האחרונה — נקודות כפולות!',

    function Wizard({ onClose }) {
      const [i, setI] = useState(0);
      const WIZARD_STEPS = wizardSteps();
      const st = WIZARD_STEPS[i];
      const last = i === WIZARD_STEPS.length - 1;
      return (
        <div className="absolute inset-0 z-50 bg-slate-950/85 flex items-center justify-center p-3">
          <div className="compact-pad bg-slate-900 border-2 border-emerald-500 rounded-3xl p-5 max-w-md w-full shadow-2xl text-center relative">
            <button onClick={() => { sound.click(); onClose(); }} className="absolute top-2 left-3 text-xs text-slate-400 underline hover:text-white">דלג ⏭</button>
            <div className="text-xs text-slate-500 mb-1">שלב {i + 1} מתוך {WIZARD_STEPS.length}</div>
            <div className="text-4xl leading-none mb-1">{st.art}</div>

              </div>
              <div className="flex gap-2">
                {i > 0 && <button onClick={() => { sound.click(); setI(i - 1); }} className="px-4 py-2 rounded-xl bg-slate-800 text-sm font-bold">→ חזרה</button>}
                <button onClick={() => { sound.click(); last ? onClose() : setI(i + 1); }}
                  className="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 text-sm font-black">{last ? 'יאללה! 🚀' : 'הבא ←'}</button>
              </div>

    }

    // ---------- Character customizer ----------
    function OptBtn({ on, onClick, children, className = '' }) {
      return (
        <button onClick={() => { sound.click(); onClick(); }}
          className={`rounded-lg text-xs font-bold border-2 transition ${on ? 'border-emerald-400 bg-emerald-900/60 text-white' : 'border-slate-700 bg-slate-800 text-slate-300'} ${className}`}>
          {children}

    }
    function Swatch({ color, on, onClick }) {
      return <button onClick={() => { sound.click(); onClick(); }} className={`w-7 h-7 rounded-full border-2 ${on ? 'border-emerald-400 ring-2 ring-emerald-400/50 scale-110' : 'border-slate-600'}`} style={{ background: color }} />;
    }
    function Row({ label, children }) {
      return (

    // ---------- Name editor ----------
    // Docked at the TOP of the screen so the on-screen keyboard (bottom half in landscape) never hides it,
    // and while it is open the game stops listening to the keyboard (it used to swallow Space/W/A/S/D/arrows)
    // and pauses rendering, so nothing re-lays out under the keyboard.
    function NameEditor({ value, gender, inputRef, onChange, onDone }) {
      const [ideas, setIdeas] = useState(() => Array.from({ length: 3 }, () => randomName(gender)));
      useEffect(() => {
        document.body.classList.add('typing');
        const g = window.__game;
        if (g) { g.input.keyboard.enabled = false; g.loop.sleep(); }
        return () => {
          document.body.classList.remove('typing');
          if (g) { g.input.keyboard.enabled = true; g.loop.wake(); }
        };
      }, []);
      return (
        <div className="name-editor fixed inset-0 z-[60] bg-slate-950/95 flex flex-col items-center"
          onPointerDown={(e) => { if (e.target === e.currentTarget) onDone(); }}>
          <div className="w-full max-w-xl px-3" style={{ paddingTop: 'max(8px, env(safe-area-inset-top))' }}>
            <div className="text-sky-300 font-black text-sm mb-1 text-center">✏️ איך קוראים לך ברחוב?</div>

              <input ref={inputRef} value={value} maxLength={16} dir="rtl"
                onChange={(e) => onChange(e.target.value)}
                enterKeyHint="done" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
                className="name-input flex-1 min-w-0 bg-slate-800 border-2 border-sky-400 rounded-xl px-3 py-2 text-lg font-bold text-white outline-none" />

            </form>
            <div className="flex items-center justify-center gap-1.5 mt-2 flex-wrap">
              <span className="text-[11px] text-slate-400">או בחר מוכן:</span>
              {ideas.map(n => (
                <button key={n} onClick={() => { sound.click(); onChange(n); onDone(n); }}
                  className="name-chip text-xs bg-slate-800 border border-slate-600 rounded-full px-3 py-1 font-bold">{n}</button>
              ))}
              <button onMouseDown={(e) => e.preventDefault()} onClick={() => { sound.click(); setIdeas(Array.from({ length: 3 }, () => randomName(gender))); }}
                className="text-xs bg-slate-800 border border-slate-600 rounded-full px-2.5 py-1">🎲</button>
              <span className="text-[10px] text-slate-500 mr-1">{value.length}/16</span>
            </div>
          </div>
        </div>
      );
    }

    function Customizer({ onClose }) {
      const [p, setP] = useState(() => JSON.parse(JSON.stringify(store.s.profile)));
      const [nameTouched, setNameTouched] = useState(!!ls.get('cypress_profile', null));
      const [editingName, setEditingName] = useState(false);
      const nameRef = useRef(null);
      // Render the editor synchronously and focus inside the same tap — iOS only opens the keyboard that way
      const openName = () => { ReactDOM.flushSync(() => setEditingName(true)); nameRef.current?.focus(); };
      const doneName = (picked) => {
        setEditingName(false);
        setP(prev => ({ ...prev, name: ((typeof picked === 'string' ? picked : prev.name) || '').trim().slice(0, 16) || randomName(prev.look.gender) }));
        nameRef.current?.blur();
      };
      const look = p.look;
      const setLook = (k, v) => setP(prev => ({
        ...prev, look: { ...prev.look, [k]: v },
        name: k === 'gender' && !nameTouched ? randomName(v) : prev.name,
      }));
      const save = () => {
        const prof = { ...p, name: (p.name || '').trim().slice(0, 16) || randomName(look.gender) };
        ls.set('cypress_profile', prof);
        store.set({ profile: prof });
        refreshPlayerTexture();
      };
      return (
        <div className="absolute inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-2 overflow-y-auto">
          <div className="compact-pad bg-slate-900 border-2 border-sky-500 rounded-3xl p-4 max-w-2xl w-full shadow-2xl my-auto">
            <h2 className="text-lg sm:text-xl font-black text-sky-300 text-center mb-2">🎨 {look.gender === 'f' ? 'מי את' : 'מי אתה'} ברחוב הברוש?</h2>
            <div className="flex gap-3">
              <div className="w-32 sm:w-40 shrink-0 flex flex-col items-center gap-1.5">
                <div className="bg-gradient-to-b from-sky-900/60 to-emerald-900/60 rounded-2xl p-2 border border-slate-700"><Avatar look={look} size={80} /></div>
                <button onClick={openName} className="name-field w-full bg-slate-800 border border-slate-600 hover:border-sky-400 rounded-lg px-2 py-1 text-sm font-bold text-white flex items-center justify-center gap-1">
                  <span className="truncate">{p.name}</span><span className="text-xs">✏️</span>
                </button>
                <button onClick={() => { sound.click(); setNameTouched(false); setP({ ...p, name: randomName(look.gender) }); }}
                  className="text-[11px] bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 font-bold">🎲 שם אקראי</button>
              </div>
              <div className="flex-1 space-y-1.5 min-w-0">
                <Row label="מין">{LOOK.gender.map(g => <OptBtn key={g.id} on={look.gender === g.id} onClick={() => setLook('gender', g.id)} className="px-3 py-1">{g.label}</OptBtn>)}</Row>
                <Row label="תספורת">{LOOK.hair.map(h => <OptBtn key={h.id} on={look.hair === h.id} onClick={() => setLook('hair', h.id)} className="px-2.5 py-1">{h.label}</OptBtn>)}</Row>
                <Row label="צבע שיער">{LOOK.hairColor.map(c => <Swatch key={c} color={c} on={look.hairColor === c} onClick={() => setLook('hairColor', c)} />)}</Row>
                <Row label="גוון עור">{LOOK.skin.map(c => <Swatch key={c} color={c} on={look.skin === c} onClick={() => setLook('skin', c)} />)}</Row>
                <Row label="בגדים">{LOOK.outfit.map(o => (
                  <OptBtn key={o.id} on={look.outfit === o.id} onClick={() => setLook('outfit', o.id)} className="p-1 flex flex-col items-center w-12">
                    <span className="w-6 h-6 rounded overflow-hidden flex flex-col border border-black/30">
                      <span className="flex-1" style={{ background: o.shirt }} /><span className="flex-1" style={{ background: o.bottom }} />
                    </span>
                    <span className="text-[8px] leading-tight mt-0.5">{o.label}</span>
                  </OptBtn>
                ))}</Row>
                <Row label="כובע">{LOOK.hat.map(h => <OptBtn key={h.id} on={look.hat === h.id} onClick={() => setLook('hat', h.id)} className="px-2.5 py-1">{h.label}</OptBtn>)}</Row>
              </div>
            </div>
            {editingName && (
              <NameEditor value={p.name} gender={look.gender} inputRef={nameRef}
                onChange={(v) => { setNameTouched(true); setP(prev => ({ ...prev, name: v })); }}
                onDone={doneName} />

            <div className="flex justify-center gap-2 mt-3">
              <button onClick={() => { sound.click(); save(); store.s.profile.home ? onClose() : store.set({ overlay: 'pickHouse' }); }} className="px-5 py-2 rounded-xl bg-slate-700 font-bold text-sm">שמור ✔</button>

            </div>
          </div>
        </div>

    // ---------- Leaderboard ----------
    function BoardList({ rows, max = 20, myPid, nowAt }) {
      if (!rows.length) return <div className="text-slate-400 text-xs py-4 text-center">עוד אין תוצאות — {G('תהיה הראשון', 'תהיי הראשונה')}! 🥇</div>;
      return (
        <ol className="space-y-1">
          {rows.slice(0, max).map((r, i) => {
            const now = r.pid === myPid && r.at === nowAt;
            const mine = r.pid === myPid;
            return (
              <li key={i} className={`flex items-center gap-2 rounded-xl px-2 py-0.5 text-sm ${now ? 'bg-emerald-600/40 border border-emerald-400' : mine ? 'bg-sky-900/40' : 'bg-slate-800/60'}`}>
                <span className="w-6 text-center font-black text-slate-300">{['🥇', '🥈', '🥉'][i] || i + 1}</span>
                <Avatar look={r.look} size={22} />

                {r.combo > 1 && <span className="text-[10px] text-pink-300">x{r.combo}🔥</span>}
                <span className="font-black text-amber-300 w-12 text-left">{r.score}</span>
              </li>
            );
          })}
        </ol>
      );
    }

    function BoardNote({ board }) {
      if (board.status === 'loading') return <div className="text-[11px] text-slate-400 text-center mt-1">טוען… ⏳</div>;
      if (board.status === 'error') return <div className="text-[11px] text-amber-300 text-center mt-1">⚠️ אין חיבור לטבלה המשותפת — מוצגים שיאים מהמכשיר הזה</div>;
      if (board.local) return <div className="text-[11px] text-slate-500 text-center mt-1">📱 שיאים מהמכשיר הזה</div>;
      return <div className="text-[11px] text-slate-500 text-center mt-1">🌍 כל השחקנים</div>;
    }

    function LeaderboardModal({ onClose }) {
      const s = useSyncExternalStore(store.sub, store.get);
      useEffect(() => { Board.refresh(); }, []);
      return (
        <div className="absolute inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-2">
          <div className="compact-pad bg-slate-900 border-2 border-amber-500 rounded-3xl p-4 max-w-md w-full shadow-2xl flex flex-col max-h-full">
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-lg sm:text-xl font-black text-amber-400">🏆 אלופי רחוב הברוש</h2>
              <button onClick={() => { sound.click(); onClose(); }} className="text-slate-300 text-xl px-2">✕</button>
            </div>
            <div className="overflow-y-auto custom-scrollbar min-h-0 flex-1 pl-1">
              <BoardList rows={s.board.rows} myPid={s.profile.pid} nowAt={s.submit?.at} />

            <BoardNote board={s.board} />

    }

    // ---------- WhatsApp group intro ("video") ----------
    const P = (from, f, text, extra = {}) => ({ from, f, text, ...extra });
    const INTRO = [
      { time: [7, 58], msgs: [
        P('נועה גרשוני', 1, 'בוקר טוב שכנים ☀️ למישהו יש שמנת לבישול? באמצע רוטב 🙈'),

        P('איתי חכים', 0, '😂😂😂', { laugh: true }),
        P('שולה ולק', 1, '🤣🤣', { laugh: true }),
        P('נועה גרשוני', 1, 'איתי אתה מלך 🙏❤️', { quote: ['איתי חכים', 'יש לי! 🙋‍♂️'] }),
      ] },
      { time: [10, 41], msgs: [
        P('גלעד נג׳ר-סבג', 0, 'דחוף!! למישהו יש מסור? עץ נפל על הקלנועית 🌳🛺'),
        P('מיכל שירי', 1, 'יש לי, של אבא שלי משנות ה-80 😅'),
