        P('רותי פינטל-ינון', 1, 'טולדו בטוח מחזיקים כזה. אולי שלושה 👑', { toledo: true }),
        P('מיכל שירי', 1, '😂😂', { laugh: true }),
        P('עמרי לנגליב', 0, '🤣🤣🤣', { laugh: true }),
        P('גלעד נג׳ר-סבג', 0, 'עמרי אלוף 🙏🙏', { quote: ['עמרי לנגליב', 'לי יש חשמלי 💪 בדרך'] }),
      ] },
      { time: [14, 12], msgs: [
        P('ליאת אייל-שוורץ', 1, 'למישהו יש אקמול? הילדים חזרו מהגן 🤒'),
        P('בועז ישראלי', 0, 'יש, משאיר לך על הדלת'),
        P('דפנה לנגליב ג׳וניור', 1, 'גם לי יש 💊'),
        P('יוסי ולק', 0, 'תשאלי את טולדו, יש להם בית מרקחת שלם', { toledo: true }),
        P('בועז ישראלי', 0, '😂😂😂', { laugh: true }),
        P('דפנה לנגליב ג׳וניור', 1, '🤣', { laugh: true }),
        P('ליאת אייל-שוורץ', 1, 'בועז תודה ❤️🙏', { quote: ['בועז ישראלי', 'יש, משאיר לך על הדלת'] }),
      ] },
      { time: [19, 27], msgs: [
        P('אורנה כהן', 1, 'שאלה מוזרה… למישהו יש פלמינגו מפלסטיק? אל תשאלו למה 🦩'),
        P('שמוליק גרשוני', 0, '😳 דווקא יש'),
        P('תמר שירי', 1, 'גם לי! מה זה הטרנד הזה?'),
        P('נמרוד חכים', 0, 'לטולדו יש עשרה. ראיתי במחסן 👑', { toledo: true }),
        P('שמוליק גרשוני', 0, '😂😂😂', { laugh: true }),
        P('תמר שירי', 1, '🤣🤣🤣', { laugh: true }),
        P('אורנה כהן', 1, 'שמוליק הצלת אותי 🦩❤️', { quote: ['שמוליק גרשוני', '😳 דווקא יש'] }),
      ] },
    ];
    const WA_COLORS = ['#e542a3', '#1f7aec', '#d97706', '#7c3aed', '#059669', '#dc2626', '#0891b2', '#c026d3', '#65a30d'];
    const waColor = (name) => WA_COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % WA_COLORS.length];
    const hhmm = ([h, m], add) => { const t = h * 60 + m + add; return `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
    const WA_WALLPAPER = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23d5cbbd' stroke-width='1.6' opacity='.55'><circle cx='20' cy='22' r='7'/><path d='M60 14 l6 10 h-12z'/><rect x='92' y='16' width='12' height='9' rx='2'/><path d='M14 70 q8 -10 16 0 t16 0'/><circle cx='80' cy='66' r='4'/><path d='M100 92 l5 5 m0 -5 l-5 5'/><path d='M44 98 c0 -8 12 -8 12 0 c0 6 -12 12 -12 12 c0 0 -12 -6 -12 -12 c0 -8 12 -8 12 0z' transform='scale(.6) translate(30 60)'/></g></svg>`).replace(/%2523/g, '%23')}")`;

    function WhatsAppIntro({ onDone }) {
      const [stage, setStage] = useState('tap'); // tap → play → fade
      const [msgs, setMsgs] = useState([]);
      const [typing, setTyping] = useState(null);
      const listRef = useRef(null);
      const stopped = useRef(false);
      const now = new Date();

      useEffect(() => { const el = listRef.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); }, [msgs, typing]);
      useEffect(() => () => { stopped.current = true; sound.introStop(); }, []);

      const finish = () => {
        if (stage === 'fade') return;
        stopped.current = true; sound.introStop(); setTyping(null);
        setStage('fade'); setTimeout(onDone, 900);
      };
      const play = async () => {
        sound.init(); requestFullScreenMode(); setStage('play'); sound.introStart();
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        let id = 0;
        for (const cyc of INTRO) {
          let toledoId = null;
          for (const [i, m] of cyc.msgs.entries()) {
            if (stopped.current) return;
            setTyping(m); await wait(m.laugh ? 150 : 340);
            if (stopped.current) return;
            const myId = ++id;
            setTyping(null);
            setMsgs(list => [...list, { ...m, id: myId, time: hhmm(cyc.time, Math.floor(i / 2)) }]);
            if (m.toledo) { toledoId = myId; sound.boing(); }
            else if (m.laugh) { sound.laugh(); const t = toledoId; setMsgs(list => list.map(x => x.id === t ? { ...x, react: (x.react || 0) + 1 } : x)); }
            else sound.msgPop();
            await wait(m.laugh ? 250 : 470);
          }
          await wait(350);
        }
        await wait(800);
        if (!stopped.current) finish();
      };

      // Lock-screen notification: the tap also unlocks audio + fullscreen
      if (stage === 'tap') {
        return (
          <div className="wa-intro fixed inset-0 z-[90] flex flex-col items-center justify-center p-4 text-white"
            style={{ background: 'radial-gradient(circle at 30% 20%, #1e3a5f, #020617 70%)' }} onClick={play}>
            <div className="text-5xl sm:text-6xl font-light tracking-wide">{now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })}</div>
            <div className="text-sm text-slate-300 mb-4">{now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
            <div className="w-full max-w-md bg-white/15 backdrop-blur-xl rounded-3xl p-3 flex gap-3 items-center shadow-2xl cursor-pointer animate-pulse">
              <img src="logo.png" alt="" className="w-11 h-11 rounded-xl" />
              <div className="flex-1 min-w-0 text-right">
                <div className="flex justify-between text-xs text-slate-200"><b>רחוב הברוש 🌳 דפנה</b><span>עכשיו</span></div>
                <div className="text-sm truncate">נועה גרשוני: בוקר טוב שכנים ☀️ למישהו יש שמנת…</div>
                <div className="text-[11px] text-slate-300">28 הודעות חדשות</div>
              </div>
            </div>
            <div className="mt-5 text-sm text-slate-200">👆 הקישו לפתיחת הקבוצה</div>
            <button onClick={(e) => { e.stopPropagation(); sound.init(); finish(); }} className="absolute bottom-4 left-4 text-xs text-slate-400 underline">דלג ⏭</button>
          </div>
        );
      }

      const subtitle = typing ? `${typing.from.split(' ')[0]} ${typing.f ? 'מקלידה' : 'מקליד'}...` : 'טולדו, אייל-שוורץ, גרשוני, ולק, חכים, כהן, שירי ועוד 21';
      return (
        <div className={`wa-intro fixed inset-0 z-[90] flex flex-col transition-opacity duration-700 ${stage === 'fade' ? 'opacity-0' : 'opacity-100'}`}
          style={{ background: '#efeae2', fontFamily: "'Segoe UI', Rubik, Helvetica, Arial, sans-serif" }}>
          {/* header */}
          <div className="safe-x shrink-0 h-14 flex items-center gap-3 text-white shadow" style={{ background: '#008069' }}>
            <span className="text-xl">→</span>
            <img src="logo.png" alt="" className="w-10 h-10 rounded-full object-cover" />
            <div className="flex-1 min-w-0">
              <div className="font-bold text-[15px] leading-tight">רחוב הברוש 🌳 דפנה</div>
              <div className={`text-xs truncate ${typing ? 'text-emerald-100' : 'text-white/80'}`}>{subtitle}</div>
            </div>
            <span className="text-lg opacity-90">📹</span><span className="text-lg opacity-90">📞</span><span className="text-xl opacity-90">⋮</span>
          </div>
          {/* messages */}
          <div ref={listRef} className="flex-1 min-h-0 overflow-y-auto px-3 sm:px-[8%] py-2 flex flex-col gap-1" style={{ backgroundImage: WA_WALLPAPER }}>
            <div className="self-center text-[11px] bg-white/90 text-slate-500 rounded-lg px-3 py-1 shadow-sm my-1">היום</div>
            <div className="self-center text-[11px] bg-amber-50 text-amber-900 rounded-lg px-3 py-1 shadow-sm mb-1 text-center max-w-md">🔒 ההודעות בקבוצת הרחוב לא מוצפנות מטולדו</div>
            {msgs.map((m, k) => {
              const first = k === 0 || msgs[k - 1].from !== m.from;
              if (m.laugh) return (
                <div key={m.id} className="wa-msg self-start flex flex-col items-start" style={{ animation: 'toastIn .2s ease-out' }}>
                  {first && <span className="text-[12px] font-bold mr-1" style={{ color: waColor(m.from) }}>{m.from}</span>}
                  <span className="text-4xl leading-tight">{m.text}</span>
                  <span className="text-[10px] text-slate-500 mr-1">{m.time}</span>
                </div>
              );
              return (
                <div key={m.id} className={`wa-msg self-start max-w-[78%] sm:max-w-[60%] bg-white rounded-lg ${first ? 'rounded-tr-none mt-1' : ''} shadow-sm px-2 pt-1 pb-0.5 relative`}
                  style={{ animation: 'toastIn .2s ease-out', marginBottom: m.react ? 14 : 0 }}>
                  {first && <div className="text-[12.5px] font-bold" style={{ color: waColor(m.from) }}>{m.from}</div>}
                  {m.quote && (
                    <div className="rounded-md px-2 py-1 mb-1 text-[12px] bg-slate-100 border-r-4" style={{ borderColor: waColor(m.quote[0]) }}>
                      <div className="font-bold" style={{ color: waColor(m.quote[0]) }}>{m.quote[0]}</div>
                      <div className="text-slate-600 truncate">{m.quote[1]}</div>
                    </div>
                  )}
                  <div className="text-[14.5px] text-[#111b21] leading-snug">
                    {m.text}<span className="inline-block w-12" />
                  </div>
                  <span className="absolute bottom-0.5 left-2 text-[10.5px] text-slate-500">{m.time}</span>
                  {m.react > 0 && (
                    <span className="absolute -bottom-3.5 right-2 bg-white rounded-full shadow px-1.5 text-[12px] border border-slate-100">😂 {m.react}</span>
                  )}
                </div>
              );
            })}
            {typing && (
              <div className="self-start bg-white rounded-lg shadow-sm px-3 py-2 flex gap-1 items-center">
                {[0, 1, 2].map(d => <span key={d} className="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: `${d * 0.15}s` }} />)}
              </div>
            )}
          </div>
          {/* input bar */}
          <div className="safe-x shrink-0 h-12 flex items-center gap-2" style={{ background: '#f0f2f5' }}>
            <span className="text-xl">😊</span><span className="text-xl">📎</span>
            <div className="flex-1 bg-white rounded-full h-8 px-4 flex items-center text-sm text-slate-400">הקלדת הודעה</div>
            <span className="w-9 h-9 rounded-full flex items-center justify-center text-white" style={{ background: '#00a884' }}>🎤</span>
          </div>
          <button onClick={finish} className="absolute top-16 left-3 z-10 text-xs font-bold bg-black/55 text-white rounded-full px-3 py-1.5">דלג ⏭</button>
        </div>
      );
    }

    // ---------- App ----------
    function App() {
      const s = useSyncExternalStore(store.sub, store.get);
      const [scorePop, setScorePop] = useState(0);

      // Phaser fills the area between the top bar and the bottom menu — no HUD is drawn over the street
      useEffect(() => {
        if (window.__game) return;
        window.__game = new Phaser.Game({
          type: Phaser.AUTO,
          parent: 'phaser-container',
          width: W, height: VIEW_H,
          backgroundColor: '#3f7a34',
          scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
          physics: { default: 'arcade', arcade: { debug: false } },
          scene: [MainScene],
        });
      }, []);

      useEffect(() => {
        if (!s.toast) return;
        const id = setTimeout(() => store.set({ toast: null }), 3200);
        return () => clearTimeout(id);
      }, [s.toast]);

      useEffect(() => { setScorePop(k => k + 1); }, [s.score]);

      const toggleSound = () => { sound.muted = !sound.muted; store.set({ muted: sound.muted }); };
      const setOverlay = (o) => store.set({ overlay: o });
      const closeWizard = () => { ls.set('cypress_onboarded', true); setOverlay(ls.get('cypress_profile', null) ? null : 'custom'); };
      const playing = s.phase === 'PLAYING' || s.phase === 'TOLEDO';
      const low = s.timeLeft <= 10;
      const best = ls.get('cypress_best', 0);
      const actionLabel = { toledo: ['👑', 'טולדו'], home: ['🏠', 'הבית'], request: ['❓', 'מה צריך?'] }[s.near] || ['🖐️', 'פעולה'];
      const keyHint = `${G('לחץ', 'לחצי')} ${IS_TOUCH ? '🖐️' : 'Space'}`;
      const context = s.near === 'toledo' ? `👑 ${G('אתה', 'את')} ליד טולדו — ${keyHint}`
        : s.near === 'home' ? `🏠 ${G('אתה', 'את')} בבית — ${keyHint} לחפץ בסיסי`
        : s.inventory.length >= 3 ? '🎒 התיק מלא — ✕ לזריקת חפץ'
        : IS_TOUCH ? '' : '⌨️ חיצים / WASD · Space ליד דלת';
      const nowIdx = s.board.rows.findIndex(r => r.pid === s.profile.pid && r.at === s.submit?.at);

      return (
        <div className="relative w-full h-full flex flex-col overflow-hidden"
          onPointerUpCapture={() => {
            // pointerup is a valid "user activation" for touch; re-enter fullscreen if the player swiped out of it
            if (IS_TOUCH && store.s.phase === 'PLAYING') requestFullScreenMode();
          }}>

          {/* ===== TOP BAR ===== */}
          <header className="safe-x shrink-0 h-10 sm:h-11 z-30 bg-slate-950 border-b border-white/10 flex justify-between items-center text-xs sm:text-sm">
            <div className="flex items-center gap-2 sm:gap-3">
              <span key={scorePop} className="pop font-black text-amber-400 text-sm sm:text-lg">🏆 {s.score}</span>
              <span className="font-bold text-purple-300 bg-purple-950/60 px-2 py-0.5 rounded-full">⭐ {s.favors}</span>
              {s.combo > 1 && <span key={'c' + s.combo} className="pop font-black text-pink-400">x{s.combo} 🔥</span>}
              {s.rush && playing && <span className="font-black text-orange-400 animate-pulse">נקודות x2!</span>}
            </div>
            <div className={`font-mono text-base sm:text-xl font-black ${low && playing ? 'text-red-400 animate-pulse' : s.rush ? 'text-orange-400' : 'text-emerald-400'}`}>
              ⏱️ {Math.floor(s.timeLeft / 60)}:{(s.timeLeft % 60).toString().padStart(2, '0')}
            </div>
            <div className="flex items-center gap-1.5">
              <span className="hidden min-[700px]:flex items-center gap-1 text-slate-300 font-bold max-w-[130px]">
                <Avatar look={s.profile.look} size={18} /><span className="truncate">{s.profile.name}</span>
              </span>
              <button onClick={toggleSound} className="p-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-lg">{s.muted ? '🔇' : '🔊'}</button>
              {CAN_FULLSCREEN && !IS_STANDALONE && !s.fs && (
                <button onClick={requestFullScreenMode} className={`p-1.5 rounded-lg ${IS_TOUCH ? 'bg-amber-500 text-slate-950 animate-pulse' : 'bg-slate-800/80 hover:bg-slate-700'}`} title="מסך מלא">⛶</button>
              )}
            </div>
          </header>

          {/* ===== STREET ===== */}
          <main className="relative flex-1 min-h-0">
            <div id="phaser-container" className="absolute inset-0" style={{ direction: 'ltr', background: '#3f7a34' }}></div>


            {/* Touch controls sit in the empty space beside the canvas on landscape phones */}
            {IS_TOUCH && s.phase === 'PLAYING' && (
              <div className="absolute inset-0 pointer-events-none z-20 flex justify-between items-end"
                style={{ padding: '0 max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left))', direction: 'ltr' }}>
                <Joystick />
                <button onPointerDown={(e) => { e.preventDefault(); Game.action(); }}
                  className={`action-btn pointer-events-auto w-20 h-20 text-slate-950 font-black rounded-full shadow-2xl flex flex-col items-center justify-center border-4 transition ${s.near === 'toledo' ? 'bg-amber-400 border-amber-200 scale-110' : s.near === 'home' ? 'bg-sky-400 border-sky-200 scale-110' : 'bg-emerald-500/85 border-emerald-300/70'}`}>
                  <span className="text-2xl leading-none">{actionLabel[0]}</span>
                  <span className="text-[10px]">{actionLabel[1]}</span>
                </button>
              </div>
            )}
          </main>

          {/* ===== BOTTOM MENU: the bag ===== */}
          <footer className="safe-x shrink-0 h-14 z-30 bg-slate-950 border-t border-white/10 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <span className="font-black text-slate-300 text-xs whitespace-nowrap">🎒 התיק</span>
              {[0, 1, 2].map(i => {
                const item = s.inventory[i];
                return item ? (
                  <div key={i} className={`h-10 flex items-center gap-1 rounded-xl border-2 pr-2 pl-1 shadow ${s.wanted[item.id] ? 'bg-emerald-800 border-emerald-300 shadow-emerald-500/50 shadow-lg' : 'bg-slate-800 border-slate-500'}`}>
                    <span className={`text-xl leading-none ${s.wanted[item.id] ? 'animate-bounce' : ''}`}>{item.icon}</span>
                    {s.wanted[item.id] && <span className="text-[10px] font-black text-emerald-200 whitespace-nowrap">💚 {s.wanted[item.id]}</span>}
                    <span className="hidden min-[700px]:inline text-[11px] font-bold text-slate-100 whitespace-nowrap">{item.name}</span>
                    {item.weight > 1 && <span className="text-[9px] bg-amber-600 text-white rounded px-1">כבד</span>}
                    <button onClick={() => Game.drop(i)} className="w-6 h-6 rounded-full bg-red-500/90 text-white text-[11px] font-black" title="זרוק">✕</button>
                  </div>
                ) : (
                  <div key={i} className="h-10 w-10 rounded-xl bg-slate-900 border-2 border-dashed border-slate-700" />
                );
              })}
            </div>
            {/* Messages live here (not over the street) */}
            {s.toast ? (
              <div key={s.toast.id}
                className={`toast-in min-w-0 max-w-[55%] border-2 text-slate-50 px-3 py-1 rounded-xl text-[11px] sm:text-xs font-semibold leading-snug line-clamp-2 ${TOAST_STYLES[s.toast.kind]}`}>
                {s.toast.msg}
              </div>
            ) : (
              <div className="text-[11px] text-slate-400 truncate">{playing ? context : ''}</div>
            )}
          </footer>

          {/* ===== START SCREEN ===== */}
          {s.phase === 'START' && !s.overlay && (
            <div className="absolute inset-0 bg-slate-950/80 flex flex-col items-center p-3 text-center z-40 overflow-y-auto [&>*:first-child]:mt-auto [&>*:last-child]:mb-auto">
              <h1 className="start-title text-4xl sm:text-6xl font-black text-emerald-400 mb-1 drop-shadow-lg flex items-center gap-3">
                <img src="logo.png" alt="" className="start-logo w-12 h-12 sm:w-16 sm:h-16 rounded-2xl shadow-lg" />רחוב הברוש
              </h1>
              <p className="text-xs sm:text-sm text-slate-300 mb-3">קיבוץ דפנה · 3 דקות · כמה שכנים {G('תספיק', 'תספיקי')} לעזור?</p>
              <div className="flex items-center gap-3 bg-slate-900/90 border border-slate-700 rounded-2xl px-3 py-1.5 mb-3">
                <Avatar look={s.profile.look} size={40} />
                <div className="text-right">
                  <div className="font-black text-white">{s.profile.name}</div>
                  <div className="text-[11px] text-slate-400">🏠 {s.profile.home ? houseById(s.profile.home)?.who : 'עוד אין בית'} · השיא שלך: {best}</div>
                </div>
                <button onClick={() => { sound.click(); setOverlay('custom'); }} className="text-xs bg-sky-700 hover:bg-sky-600 rounded-xl px-3 py-1.5 font-bold">✏️ ערוך דמות</button>
              </div>
              <button onClick={() => Game.start()}
                className="start-btn bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl sm:text-2xl px-10 py-3 rounded-full shadow-2xl transition transform active:scale-95">
                התחל משחק! 🚀
              </button>
              <div className="flex gap-2 mt-3">
                <button onClick={() => { sound.click(); setOverlay('board'); }} className="text-xs bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5 font-bold">🏆 טבלת אלופים</button>
                <button onClick={() => { sound.click(); setOverlay('pickHouse'); }} className="text-xs bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5 font-bold">🏠 החלף בית</button>
                <button onClick={() => { sound.click(); setOverlay('wizard'); }} className="text-xs bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5 font-bold">❓ איך משחקים</button>
              </div>
              {IS_TOUCH && !IS_STANDALONE && (
                CAN_FULLSCREEN
                  ? <p className="start-hint text-[11px] text-slate-400 mt-3">📺 המשחק עובר למסך מלא (בלי שורת כתובת) כשלוחצים "התחל"</p>
                  : <p className="start-hint text-xs text-amber-200 mt-3 bg-amber-950/60 border border-amber-500/40 rounded-xl px-3 py-1.5">
                      📲 {IS_IOS ? 'באייפון' : 'בדפדפן הזה'} אפשר להסתיר את שורת הכתובת רק מהמסך הבית: לחצו <b>שתף ⬆️</b> ← <b>"הוסף למסך הבית"</b>
                    </p>
              )}
            </div>
          )}

          {/* ===== GAME OVER ===== */}
          {s.phase === 'OVER' && s.final && !s.overlay && (
            <div className="absolute inset-0 bg-slate-950/90 flex items-center justify-center p-3 z-40 overflow-y-auto">
              <div className="flex flex-col sm:flex-row gap-4 items-center sm:items-stretch max-w-3xl w-full my-auto">
                <div className="flex-1 flex flex-col items-center justify-center text-center">
                  <h2 className="text-2xl sm:text-4xl font-black text-amber-400">נגמר הזמן! ⏰</h2>
                  {s.final.isRecord && <div className="text-pink-400 font-black animate-bounce">🎉 שיא אישי חדש!</div>}
                  <div className="flex items-center gap-2 my-1">
                    <Avatar look={s.profile.look} size={40} />
                    <p className="text-4xl sm:text-6xl font-black text-emerald-400">{s.final.score}</p>
                  </div>
                  <p className="text-xs text-slate-300 mb-2">{rankFor(s.final.score)} · שיא: {s.final.best}</p>
                  <div className="grid grid-cols-4 gap-1.5 mb-3 text-[11px]">
                    {[['📦', 'מסירות', s.final.deliveries], ['🔥', 'קומבו', 'x' + s.final.bestCombo], ['😤', 'פספוסים', s.final.missed], ['💥', 'תאונות', s.final.hits]].map(([ic, lb, v]) => (
                      <div key={lb} className="bg-slate-900 border border-slate-700 rounded-xl px-2 py-1">
                        <div>{ic} <b className="text-white">{v}</b></div><div className="text-slate-400">{lb}</div>
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => Game.start()} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg px-7 py-2.5 rounded-full shadow-2xl active:scale-95">שחק שוב 🔄</button>
                    <button onClick={() => { sound.click(); setOverlay('custom'); }} className="bg-slate-800 border border-slate-600 text-sm font-bold px-4 rounded-full">✏️ דמות</button>
                  </div>
                </div>
                <div className="w-full sm:w-72 bg-slate-900/90 border border-amber-500/50 rounded-2xl p-3 flex flex-col">
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="font-black text-amber-400 text-sm">🏆 טבלת אלופים</span>
                    <span className="text-[11px] text-slate-300">
                      {s.submit?.status === 'sending' ? '📡 שולח…'
                        : nowIdx >= 0 ? `${G('אתה', 'את')} במקום ${nowIdx + 1}!`
                        : s.submit?.status === 'error' ? '⚠️ לא נשלח'
                        : s.final.score > 0 && s.board.status === 'ok' ? 'מחוץ לטופ 20' : ''}
                    </span>
                  </div>
                  <BoardList rows={s.board.rows} max={5} myPid={s.profile.pid} nowAt={s.submit?.at} />
                  <button onClick={() => { sound.click(); setOverlay('board'); }} className="text-[11px] text-sky-300 underline mt-1.5">לטבלה המלאה ←</button>
                  <BoardNote board={s.board} />
                </div>
              </div>
            </div>
          )}

          {/* ===== TOLEDO MODAL — the street keeps running behind it, so the small talk costs time ===== */}
          {s.phase === 'TOLEDO' && (
            <div className="absolute inset-0 bg-slate-950/55 flex items-center justify-center p-3 z-40">
              <div className="compact-pad bg-slate-900/95 border-2 border-amber-500 p-4 sm:p-5 rounded-3xl max-w-lg w-full shadow-2xl text-center">
                <h2 className="text-xl sm:text-2xl font-black text-amber-400">👑 אחוזת משפחת טולדו</h2>
                <p className="text-[11px] text-slate-400 mb-2">יש להם הכל במחסן. הרחוב ממשיך לרוץ בזמן {G('שאתה', 'שאת')} פה!</p>
                {s.toledoWait > 0 ? (
                  <div className="py-3 space-y-2">
                    <p className="text-slate-200 text-sm animate-pulse">☕ טולדו מוזג קפה ומספר על הימים הראשונים בדפנה...</p>
                    <div className="text-4xl font-black text-amber-500 font-mono">{s.toledoWait}</div>
                    <button onClick={() => Game.skipToledo()} disabled={s.favors < 1}
                      className="bg-purple-600 hover:bg-purple-500 disabled:opacity-40 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-lg">
                      דלג על השיחה (1 ⭐) · יש לך {s.favors}
                    </button>
                  </div>
                ) : (
                  <div>
                    <p className="text-xs text-slate-300 mb-2">{G('בחר', 'בחרי')} חפצים ({s.inventory.length}/3):</p>
                    <div className="grid grid-cols-5 sm:grid-cols-6 gap-1.5 max-h-48 overflow-y-auto p-1 custom-scrollbar">
                      {ITEM_LIST.map(item => (
                        <button key={item.id} onClick={() => Game.pickToledo(item)}
                          className="bg-slate-800 border border-slate-700 hover:border-amber-500 p-1.5 rounded-xl flex flex-col items-center active:scale-95">
                          <span className="text-2xl">{item.icon}</span>
                          <span className="text-[9px] font-bold text-slate-200 leading-tight">{item.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
                <button onClick={() => Game.closeToledo()} className="mt-3 text-xs text-slate-300 underline hover:text-white">חזרה לרחוב ←</button>
              </div>
            </div>
          )}

          {/* ===== PICK YOUR HOUSE (banner only — the street stays visible and tappable) ===== */}
          {s.overlay === 'pickHouse' && (
            <div className="safe-x absolute top-0 inset-x-0 h-10 sm:h-11 z-40 bg-sky-700 border-b-2 border-sky-300 flex items-center justify-center gap-3 shadow-2xl">
              <span className="text-sm sm:text-base font-black text-white animate-pulse">🏠 {G('איפה אתה גר? לחץ', 'איפה את גרה? לחצי')} על הבית שלך ברחוב 👇</span>
              {s.profile.home && <button onClick={() => { sound.click(); setOverlay(null); }} className="text-xs bg-sky-900 rounded-lg px-3 py-1 font-bold">ביטול</button>}
            </div>
          )}

          {/* ===== OVERLAYS ===== */}
          {s.intro && <WhatsAppIntro onDone={() => store.set({ intro: false })} />}
          {s.overlay === 'wizard' && <Wizard onClose={closeWizard} />}
          {s.overlay === 'custom' && <Customizer onClose={() => setOverlay(null)} />}
          {s.overlay === 'board' && <LeaderboardModal onClose={() => setOverlay(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
