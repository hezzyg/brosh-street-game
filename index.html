    // ==========================================
    // 2. WEB AUDIO SYNTHESIZER
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmInterval = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playTone(freq, type, duration, vol = 0.1) {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playNewRequest() {
        this.init();
        this.playTone(587.33, 'sine', 0.12, 0.15); // D5
        setTimeout(() => this.playTone(880, 'sine', 0.2, 0.18), 80); // A5
      }

      playPickup() {
        this.init();
        this.playTone(523, 'sine', 0.1, 0.15);
        setTimeout(() => this.playTone(1046, 'sine', 0.15, 0.15), 60);
      }

      playDeliverSuccess() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.2), idx * 70);
        });
      }

      playHit() {
        this.init();
        this.playTone(100, 'sawtooth', 0.3, 0.3);
        setTimeout(() => this.playTone(60, 'sawtooth', 0.4, 0.3), 80);
      }

      playClick() {
        this.init();
        this.playTone(700, 'sine', 0.04, 0.08);
      }

      startBGM() {
        this.init();
        if (this.bgmInterval) return;
        const melody = [261, 329, 392, 329, 293, 349, 440, 349];
        let noteIdx = 0;
        this.bgmInterval = setInterval(() => {
          if (!this.muted) {
            this.playTone(melody[noteIdx], 'sine', 0.22, 0.025);
            noteIdx = (noteIdx + 1) % melody.length;
          }
        }, 300);
      }

      stopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }
    }

        window.gameBridge.phaserScene = this;

        this.drawKibbutzMap();

        this.housesGroup = this.physics.add.staticGroup();
        this.housesData = JSON.parse(JSON.stringify(HOUSES_CONFIG));

        this.housesData.forEach(h => {
          const houseSprite = this.housesGroup.create(h.x, h.y, h.spriteKey);
          houseSprite.setOrigin(0.5, 0.5);
          houseSprite.houseData = h;

          const labelColor = h.isToledo ? '#fef08a' : (h.isPlayerHome ? '#93c5fd' : '#ffffff');
          this.add.text(h.x, h.y + (h.side === 'N' ? -54 : 48), h.name, {
            fontFamily: 'Rubik',
            fontSize: '12px',
            fontWeight: 'bold',
            color: labelColor,
            stroke: '#000000',
            strokeThickness: 3
          }).setOrigin(0.5);
        });

        this.player = this.physics.add.sprite(120, 430, 'player');
        this.player.setCollideWorldBounds(true);
        this.player.setCircle(16, 16, 16);

        this.playerLabel = this.add.text(120, 400, 'אתה 🙋‍♂️', {
          fontFamily: 'Rubik',
          fontSize: '12px',
          fontWeight: '900',
          color: '#38bdf8',
          stroke: '#0f172a',
          strokeThickness: 3
        }).setOrigin(0.5);

        this.aiCompetitors = this.physics.add.group();
        this.vehicles = this.physics.add.group();
        this.groundItemsGroup = this.physics.add.group();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
          up: Phaser.Input.Keyboard.KeyCodes.W,
          down: Phaser.Input.Keyboard.KeyCodes.S,
          left: Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.D,
          space: Phaser.Input.Keyboard.KeyCodes.SPACE,
          e: Phaser.Input.Keyboard.KeyCodes.E
        });

        this.input.keyboard.on('keydown-SPACE', () => this.handleAction());
        this.input.keyboard.on('keydown-E', () => this.handleAction());

        this.physics.add.overlap(this.player, this.vehicles, this.handleVehicleHit, null, this);
        this.physics.add.overlap(this.player, this.groundItemsGroup, this.handleItemPickup, null, this);
      }

      drawKibbutzMap() {
        const graphics = this.add.graphics();

        graphics.fillGradientStyle(0x152e14, 0x152e14, 0x1e3f1c, 0x1e3f1c, 1);
        graphics.fillRect(0, 0, 1000, 600);

        graphics.fillStyle(0x64748b, 1);
        graphics.fillRect(0, 150, 1000, 55);
        graphics.fillRect(0, 395, 1000, 55);

        for (let x = 0; x < 1000; x += 30) {
          const isRed = (x / 30) % 2 === 0;
          graphics.fillStyle(isRed ? 0xdc2626 : 0xf8fafc, 1);
          graphics.fillRect(x, 201, 30, 4);
          graphics.fillRect(x, 395, 30, 4);
        }

        graphics.fillStyle(0x1f2937, 1);
        graphics.fillRect(0, 205, 1000, 190);

        graphics.lineStyle(4, 0xfacc15, 1);
        graphics.beginPath();
        for (let x = 0; x < 1000; x += 40) {
          graphics.moveTo(x, 300);
          graphics.lineTo(x + 20, 300);
        }
        graphics.strokePath();

        graphics.fillStyle(0xf8fafc, 1);
        [120, 500, 880].forEach(cx => {
          for (let cy = 215; cy < 385; cy += 22) {
            graphics.fillRect(cx - 20, cy, 40, 10);
          }
        });

        const treePositions = [40, 210, 390, 580, 770, 950];
        treePositions.forEach(tx => {
          [125, 470].forEach(ty => {
            this.add.image(tx, ty, 'tree_cypress').setDepth(2);
          });
        });
      }

      update(time, delta) {
        if (!window.gameBridge.reactState || window.gameBridge.reactState.gameState !== 'PLAYING') return;

        const player = this.player;
        const state = window.gameBridge.reactState;

        const totalWeight = state.inventory.reduce((acc, curr) => acc + curr.weight, 0);
        const currentSpeed = Math.max(140, 260 - totalWeight * 30);

        if (player.stunnedTimer > 0) {
          player.stunnedTimer -= delta;
          player.setVelocity(0, 0);
        } else {
          let vx = 0;
          let vy = 0;

          if (this.cursors.left.isDown || this.wasd.left.isDown || state.virtualKeys.left) vx -= 1;
          if (this.cursors.right.isDown || this.wasd.right.isDown || state.virtualKeys.right) vx += 1;
          if (this.cursors.up.isDown || this.wasd.up.isDown || state.virtualKeys.up) vy -= 1;
          if (this.cursors.down.isDown || this.wasd.down.isDown || state.virtualKeys.down) vy += 1;

          if (vx !== 0 && vy !== 0) {
            vx *= 0.7071;
            vy *= 0.7071;
          }

          player.setVelocity(vx * currentSpeed, vy * currentSpeed);
        }

        this.playerLabel.setPosition(player.x, player.y - 28);

        this.aiCompetitors.getChildren().forEach(ai => {
          if (!ai.targetHouse || !ai.targetHouse.currentRequest) {
            ai.destroy();
            return;
          }
          const dist = Phaser.Math.Distance.Between(ai.x, ai.y, ai.targetHouse.x, ai.targetHouse.y);
          if (dist < 25) {
            ai.targetHouse.currentRequest = null;
            if (window.gameBridge.onAiDelivered) {
              window.gameBridge.onAiDelivered(ai.name, ai.targetHouse.name);
            }
            ai.destroy();
          } else {
            this.physics.moveToObject(ai, ai.targetHouse, 130);
          }
        });

        this.vehicles.getChildren().forEach(v => {
          if (v.isObstacle) return;
          if (v.x < -100 || v.x > 1100) v.destroy();
        });

        this.updateRequestOverlays(time);
      }

      updateRequestOverlays(time) {
        if (this.overlayGraphics) this.overlayGraphics.destroy();
        if (this.overlayImages) this.overlayImages.forEach(img => img.destroy());
        if (this.overlayTexts) this.overlayTexts.forEach(t => t.destroy());

        this.overlayGraphics = this.add.graphics().setDepth(10);
        this.overlayImages = [];
        this.overlayTexts = [];

        const state = window.gameBridge.reactState;

        // --- HOUSES WITH ACTIVE REQUESTS ---
        this.housesData.forEach(h => {
          if (h.currentRequest) {
            const req = h.currentRequest;
            const bubbleY = h.y - 12;
            const hasItemInInv = state && state.inventory.some(i => i.id === req.item.id);

            // Dynamic pulsating aura
            const pulseScale = 1 + Math.sin(time * 0.008) * 0.16;
            const auraRadius = 46 * pulseScale;
            const auraColor = hasItemInInv ? 0x10b981 : (req.patience < 30 ? 0xef4444 : 0xfacc15);

            this.overlayGraphics.lineStyle(4, auraColor, 0.85);
            this.overlayGraphics.strokeCircle(h.x, h.y, auraRadius);
            this.overlayGraphics.fillStyle(auraColor, 0.15);
            this.overlayGraphics.fillCircle(h.x, h.y, auraRadius);

            // White Request Bubble Background
            this.overlayGraphics.fillStyle(0xffffff, 1);
            this.overlayGraphics.fillCircle(h.x, bubbleY, 34);

            const strokeColor = hasItemInInv ? 0x10b981 : (req.patience < 30 ? 0xef4444 : 0x0284c7);
            this.overlayGraphics.lineStyle(hasItemInInv ? 6 : 4, strokeColor, 1);
            this.overlayGraphics.strokeCircle(h.x, bubbleY, 34);

            // Clean Vector SVG Image Sprite Texture inside Request Bubble
            if (req.item && req.item.key) {
              const itemImg = this.add.image(h.x, bubbleY, req.item.key).setDisplaySize(40, 40).setDepth(11);
              this.overlayImages.push(itemImg);
            }

            // Gold Score Badge (+100pt)
            this.overlayGraphics.fillStyle(0xfacc15, 1);
            this.overlayGraphics.fillRoundedRect(h.x - 28, bubbleY - 50, 56, 18, 9);
            this.overlayGraphics.lineStyle(1.5, 0x78350f, 1);
            this.overlayGraphics.strokeRoundedRect(h.x - 28, bubbleY - 50, 56, 18, 9);

            const scoreTxt = this.add.text(h.x, bubbleY - 41, `+${req.item.points}pt`, {
              fontFamily: 'Rubik', fontSize: '11px', fontWeight: '900', color: '#0f172a'
            }).setOrigin(0.5).setDepth(11);
            this.overlayTexts.push(scoreTxt);

            if (hasItemInInv) {
              const holdTxt = this.add.text(h.x, bubbleY + 44, '👇 יש בבית!', {
                fontFamily: 'Rubik', fontSize: '12px', fontWeight: '900', color: '#10b981', stroke: '#000000', strokeThickness: 3
              }).setOrigin(0.5).setDepth(11);
              this.overlayTexts.push(holdTxt);
            }

            // Patience Bar
            this.overlayGraphics.fillStyle(0x1e293b, 1);
            this.overlayGraphics.fillRect(h.x - 26, bubbleY + 35, 52, 5);
            this.overlayGraphics.fillStyle(req.patience < 30 ? 0xef4444 : 0x10b981, 1);
            this.overlayGraphics.fillRect(h.x - 26, bubbleY + 35, (req.patience / 100) * 52, 5);
          }
        });
      }

      handleVehicleHit(player, vehicle) {
        if (player.stunnedTimer > 0) return;
        sound.playHit();

        player.stunnedTimer = 1200;
        this.cameras.main.shake(300, 0.015);

        if (window.gameBridge.onHitVehicle) {
          window.gameBridge.onHitVehicle(vehicle.type, vehicle.isObstacle);
        }

        if (vehicle.isObstacle) {
          vehicle.body.enable = false;
          vehicle.destroy();
        } else {
          vehicle.destroy();
        }
      }

      handleItemPickup(player, itemSprite) {
        if (itemSprite.processingPickup) return;
        itemSprite.processingPickup = true;
        if (itemSprite.body) itemSprite.body.enable = false;

        if (window.gameBridge.onPickupGroundItem) {
          const success = window.gameBridge.onPickupGroundItem(itemSprite.itemData);
          if (success) {
            sound.playPickup();
            itemSprite.destroy();
          } else {
            itemSprite.processingPickup = false;
            if (itemSprite.body) itemSprite.body.enable = true;
          }
        }
      }

      spawnVehicle() {
        const types = [
          { name: 'קלנועית 🛺', speed: 180, sprite: 'cart_kibbutz' },
          { name: 'ילד על קורקינט 🛴👦', speed: 280, sprite: 'scooter_kid' },
          { name: 'טרקטור 🚜', speed: 110, sprite: 'tractor' },
          { name: 'פרה שברחה מהרפת 🐄', speed: 80, sprite: 'cow' },
          { name: 'במבה על הכביש 🍿', speed: 0, sprite: 'bamba', isObstacle: true }
        ];

        const selected = Phaser.Math.RND.pick(types);
        const dir = Math.random() > 0.5 ? 1 : -1;
        const spawnX = selected.isObstacle ? Phaser.Math.Between(180, 820) : (dir === 1 ? -60 : 1060);
        const spawnY = selected.isObstacle ? Phaser.Math.Between(220, 370) : Phaser.Math.Between(240, 360);

        const v = this.vehicles.create(spawnX, spawnY, selected.sprite);
        v.type = selected.name;
        v.isObstacle = selected.isObstacle;

        if (!selected.isObstacle) {
          v.setVelocityX(selected.speed * dir);
        }
      }

      spawnAiCompetitor(targetHouse, item) {
        const eligibleSources = this.housesData.filter(h => h.id !== targetHouse.id && !h.isPlayerHome);
        const source = Phaser.Math.RND.pick(eligibleSources);
        const neighborNames = ['שמעון', 'רונית', 'אבנר', 'תמר', 'גדי', 'ענת', 'יוסי', 'מיכל'];
        const neighborSprites = ['ai_neighbor', 'ai_female_1', 'ai_male_2', 'ai_female_2'];

        const spriteKey = Phaser.Math.RND.pick(neighborSprites);
        const ai = this.aiCompetitors.create(source.x, source.y, spriteKey);
        ai.targetHouse = targetHouse;
        ai.name = Phaser.Math.RND.pick(neighborNames);

        this.add.text(ai.x, ai.y - 20, `${ai.name} (${item.name})`, {
          fontFamily: 'Rubik', fontSize: '11px', fontWeight: 'bold', color: '#ef4444', stroke: '#000', strokeThickness: 2
        }).setOrigin(0.5);
      }

      dropItemOnGround(item, x, y) {
        const itemSprite = this.groundItemsGroup.create(x, y, item.key || 'milk');
        itemSprite.itemData = item;
      }

      handleAction() {
        if (!this.player || !window.gameBridge.reactState || window.gameBridge.reactState.gameState !== 'PLAYING') return;

        const player = this.player;
        this.housesGroup.getChildren().forEach(houseSprite => {
          const house = houseSprite.houseData;
          const dist = Phaser.Math.Distance.Between(player.x, player.y, house.x, house.y);
          if (dist < 65) {
            if (house.isToledo) {
              if (window.gameBridge.onOpenToledo) window.gameBridge.onOpenToledo();
            } else if (house.isPlayerHome) {
              if (window.gameBridge.onRestockHome) window.gameBridge.onRestockHome();
            } else if (house.currentRequest) {
              if (window.gameBridge.onFulfillRequest) window.gameBridge.onFulfillRequest(house);
            }
          }
        });
      }
    }

    // ==========================================
    // 5. REACT UI OVERLAY COMPONENT
    // ==========================================
    function CypressStreetApp() {
      const [gameState, setGameState] = useState('START');
      const [score, setScore] = useState(0);
      const [favors, setFavors] = useState(1);
      const [combo, setCombo] = useState(1);
      const [timeLeft, setTimeLeft] = useState(180);
      const [inventory, setInventory] = useState([]);
      const [cornerToast, setCornerToast] = useState(null); // Corner Toast Notifications
      const [isMuted, setIsMuted] = useState(false);
      const [isPortrait, setIsPortrait] = useState(window.innerHeight > window.innerWidth);
      const [virtualKeys, setVirtualKeys] = useState({ up: false, down: false, left: false, right: false });

      const [toledoChatTimer, setToledoChatTimer] = useState(0);
      const [canPickToledoItem, setCanPickToledoItem] = useState(false);

      const phaserContainerRef = useRef(null);

      const triggerToast = (text, icon = '⚠️') => {
        setCornerToast({ text, icon, id: Date.now() });
        setTimeout(() => {
          setCornerToast(prev => (prev && prev.id === cornerToast?.id ? null : prev));
        }, 3200);
      };

      useEffect(() => {
        window.gameBridge.reactState = {
          gameState, inventory, favors, score, combo, virtualKeys
        };
      }, [gameState, inventory, favors, score, combo, virtualKeys]);

      useEffect(() => {
        const config = {
          type: Phaser.AUTO,
          parent: phaserContainerRef.current,
          width: '100%',
          height: '100%',
          scale: {
            mode: Phaser.Scale.RESIZE,
            autoCenter: Phaser.Scale.CENTER_BOTH
          },
          physics: {
            default: 'arcade',
            arcade: { gravity: { y: 0 }, debug: false }
          },
          scene: [MainScene]
        };

        const game = new Phaser.Game(config);

        const handleResize = () => setIsPortrait(window.innerHeight > window.innerWidth);
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          game.destroy(true);
        };
      }, []);

      useEffect(() => {
        window.gameBridge.onOpenToledo = () => {
          setGameState('TOLEDO');
          setToledoChatTimer(3);
          setCanPickToledoItem(false);

          const timer = setInterval(() => {
            setToledoChatTimer(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setCanPickToledoItem(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        };

        window.gameBridge.onRestockHome = () => {
          setInventory(prev => {
            if (prev.length >= 3) {
              triggerToast('הבית שלך מלא (3/3 חפצים)! לחץ ✕ ליד חפץ בתחתית כדי לפנות מקום.', '🏠');
              return prev;
            }
            sound.playPickup();
            const basic = [ITEMS.milk, ITEMS.eggs, ITEMS.screwdriver];
            const added = basic[Math.floor(Math.random() * basic.length)];
            triggerToast(`לקחת מהמזווה בבית: ${added.name}`, '📦');
            return [...prev, added];
          });
        };

        window.gameBridge.onFulfillRequest = (house) => {
          const reqItem = house.currentRequest.item;
          setInventory(prevInv => {
            const itemIdx = prevInv.findIndex(i => i.id === reqItem.id);
            if (itemIdx !== -1) {
              sound.playDeliverSuccess();
              const newInv = [...prevInv];
              newInv.splice(itemIdx, 1);

              const gainedPoints = reqItem.points * combo;
              setScore(s => s + gainedPoints);
              setFavors(f => f + 1);
              setCombo(c => Math.min(c + 1, 4));

              house.currentRequest = null;

              const gifts = [ITEMS.drill, ITEMS.seinfeld, ITEMS.sourdough, ITEMS.flamingo, ITEMS.pokemon];
              const gift = gifts[Math.floor(Math.random() * gifts.length)];
              triggerToast(`✨ מעולה! הבאת ל-${house.name} את ה-${reqItem.name}! קיבלת מתנה!`, '🎁');

              if (newInv.length < 3) return [...newInv, gift];
              return newInv;
            } else {
              if (prevInv.length === 0) {
                triggerToast(`💡 הבית שלך ריק! קפוץ לבית 1 (שלך) או לאחוזת טולדו 👑 להביא ${reqItem.name}!`, '👑');
              } else {
                triggerToast(`💡 חסר לך ${reqItem.name}! (יש לך: ${prevInv.map(i => i.name).join(', ')}). קפוץ לאחוזת טולדו 👑 בצד שמאל להשיג אותו!`, '👑');
              }
              return prevInv;
            }
          });
        };

        window.gameBridge.onHitVehicle = (name, isObstacle) => {
          triggerToast(isObstacle ? `🍌 החלקת על ${name}!` : `💥 נתקלת ב-${name}! החפצים עפו לרצפה.`, '⚠️');
          if (!isObstacle) {
            setInventory(prev => {
              const scene = window.gameBridge.phaserScene;
              if (scene && scene.player) {
                prev.forEach(item => scene.dropItemOnGround(item, scene.player.x, scene.player.y));
              }
              return [];
            });
          }
        };

        window.gameBridge.onPickupGroundItem = (item) => {
          let success = false;
          setInventory(prev => {
            if (prev.length < 3) {
              success = true;
              triggerToast(`רמת מהרצפה: ${item.name}`, '📦');
              return [...prev, item];
            } else {
              triggerToast('הבית שלך מלא!', '🏠');
              return prev;
            }
          });
          return success;
        };

        window.gameBridge.onAiDelivered = (aiName, houseName) => {
          setCombo(1);
          triggerToast(`😱 ${aiName} השכן הקדים אותך והביא ל-${houseName} את המבוקש!`, '🏃‍♂️');
        };
      }, [combo]);

      useEffect(() => {
        if (gameState !== 'PLAYING') return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              sound.stopBGM();
              setGameState('GAME_OVER');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [gameState]);

      useEffect(() => {
        if (gameState !== 'PLAYING') return;

        const reqInterval = setInterval(() => {
          const scene = window.gameBridge.phaserScene;
          if (!scene) return;

          const eligible = scene.housesData.filter(h => !h.isPlayerHome && !h.isToledo && !h.currentRequest);
          if (eligible.length === 0) return;

          const targetHouse = eligible[Math.floor(Math.random() * eligible.length)];
          const itemKeys = Object.keys(ITEMS);
          const item = ITEMS[itemKeys[Math.floor(Math.random() * itemKeys.length)]];

          targetHouse.currentRequest = { item, patience: 100, duration: 20, aiDispatched: false };
          sound.playNewRequest(); // Audio chime for new request
        }, 4500);

        const vehicleInterval = setInterval(() => {
          const scene = window.gameBridge.phaserScene;
          if (scene) scene.spawnVehicle();
        }, 4000);

        const aiCheckInterval = setInterval(() => {
          const scene = window.gameBridge.phaserScene;
          if (!scene) return;
          scene.housesData.forEach(h => {
            if (h.currentRequest && h.currentRequest.patience < 75 && !h.currentRequest.aiDispatched) {
              h.currentRequest.aiDispatched = true;
              scene.spawnAiCompetitor(h, h.currentRequest.item);
            }
            if (h.currentRequest) {
              h.currentRequest.patience -= 5;
              if (h.currentRequest.patience <= 0) {
                h.currentRequest = null;
                setCombo(1);
                triggerToast(`❌ הבקשה מ-${h.name} פגה!`, '⏰');
              }
            }
          });
        }, 1000);

        return () => {
          clearInterval(reqInterval);
          clearInterval(vehicleInterval);
          clearInterval(aiCheckInterval);
        };
      }, [gameState]);

      const startGame = () => {
        sound.init();
        sound.startBGM();

        const keys = Object.keys(ITEMS);
        const item1 = ITEMS[keys[Math.floor(Math.random() * keys.length)]];
        let item2 = ITEMS[keys[Math.floor(Math.random() * keys.length)]];
        while (item2.id === item1.id) item2 = ITEMS[keys[Math.floor(Math.random() * keys.length)]];

        const initialInv = [item1, item2];
        setInventory(initialInv);
        setScore(0);
        setFavors(1);
        setCombo(1);
        setTimeLeft(180);
        setGameState('PLAYING');

        setTimeout(() => {
          const scene = window.gameBridge.phaserScene;
          if (!scene) return;
          const eligible = scene.housesData.filter(h => !h.isPlayerHome && !h.isToledo);
          const target = eligible[Math.floor(Math.random() * eligible.length)];
          const matchItem = Math.random() > 0.5 ? item1 : item2;

          target.currentRequest = { item: matchItem, patience: 100, duration: 25, aiDispatched: false };
          sound.playNewRequest();
          triggerToast(`🚀 התחלה מהירה! ל-${target.name} דרוש ${matchItem.name} - יש בבית!`, '🌟');
        }, 600);
      };

      const toggleSound = () => {
        sound.muted = !sound.muted;
        setIsMuted(sound.muted);
      };

      const pickToledoItem = (item) => {
        sound.playPickup();
        if (inventory.length >= 3) {
          alert('הבית שלך מלא! (מקסימום 3 חפצים)');
          return;
        }
        setInventory(prev => [...prev, item]);
        setGameState('PLAYING');
        triggerToast(`לקחת מטולדו: ${item.name}!`, '👑');
      };

      const skipToledoTalkWithFavor = () => {
        if (favors < 1) return;
        sound.playClick();
        setFavors(f => f - 1);
        setCanPickToledoItem(true);
        setToledoChatTimer(0);
      };

      const dropItem = (idx) => {
        if (idx >= inventory.length) return;
        sound.playClick();
        const itemToDrop = inventory[idx];
        const newInv = [...inventory];
        newInv.splice(idx, 1);
        setInventory(newInv);

        const scene = window.gameBridge.phaserScene;
        if (scene && scene.player) {
          scene.dropItemOnGround(itemToDrop, scene.player.x, scene.player.y);
        }
        triggerToast(`הפלת ${itemToDrop.name} על המדרכה.`, '📦');
      };

      const setTouchKey = (key, active) => {
        setVirtualKeys(prev => ({ ...prev, [key]: active }));
      };

      return (
        <div class="h-full w-full relative bg-slate-950 overflow-hidden flex flex-col justify-between">
          
          {/* Orientation Warning */}
          {isPortrait && (
            <div class="absolute inset-0 bg-slate-950/98 z-50 flex flex-col items-center justify-center p-6 text-center">
              <div class="text-6xl mb-4 animate-bounce">📱🔄</div>
              <h2 class="text-2xl font-black text-yellow-400 mb-2">סובב את המכשיר למצב אופקי</h2>
              <p class="text-slate-300 text-sm max-w-xs">
                רחוב הברוש מתוכנן למצב אופקי (Landscape) לתצוגת רחוב מלאה!
              </p>
            </div>
          )}

          {/* 1. TOP FLOATING HUD OVERLAY */}
          <header class="absolute top-0 left-0 right-0 z-20 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/60 px-4 py-2 shadow-lg flex justify-between items-center h-11 text-xs sm:text-sm">
            <div class="flex items-center gap-4">
              <span class="font-black text-yellow-400">🏆 {score}pt</span>
              <span class="font-bold text-purple-400">⭐ {favors}</span>
              {combo > 1 && <span class="font-black text-pink-500 animate-pulse">x{combo} Combo!</span>}
            </div>
            
            <div class="font-mono text-lg sm:text-2xl text-emerald-400 font-black">
              ⏱️ {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
            </div>

            <div class="flex items-center gap-2">
              <button onClick={toggleSound} class="p-1.5 bg-slate-800/80 rounded-lg text-xs hover:bg-slate-700">
                {isMuted ? '🔇' : '🔊'}
              </button>
              <button 
                onClick={() => setGameState(gameState === 'PLAYING' ? 'START' : 'PLAYING')}
                class="bg-slate-800/80 hover:bg-slate-700 px-3 py-1 rounded-lg font-bold text-xs">
                {gameState === 'PLAYING' ? 'השהה' : 'חזור'}
              </button>
            </div>
          </header>

          {/* 2. FULL-SCREEN PHASER CANVAS CONTAINER */}
          <main class="absolute inset-0 w-full h-full z-0">
            <div ref={phaserContainerRef} class="w-full h-full"></div>
          </main>

          {/* 3. CORNER FLY-IN TOAST NOTIFICATION */}
          {cornerToast && (
            <div class="absolute bottom-14 right-4 z-30 animate-slide-in-right bg-slate-900/95 border-2 border-amber-400/80 text-amber-200 px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md max-w-sm">
              <span class="text-xl">{cornerToast.icon}</span>
              <span class="text-xs sm:text-sm font-bold">{cornerToast.text}</span>
            </div>
          )}

          {/* MOBILE TOUCH OVERLAY CONTROLS */}
          {gameState === 'PLAYING' && (
            <div class="absolute inset-0 pointer-events-none z-20 flex justify-between p-4 sm:hidden">
              <div class="pointer-events-auto self-end grid grid-cols-3 gap-1 w-32 h-32 opacity-85">
                <div></div>
                <button 
                  onTouchStart={() => setTouchKey('up', true)} onTouchEnd={() => setTouchKey('up', false)}
                  class="bg-slate-800/90 active:bg-emerald-500 rounded-xl flex items-center justify-center text-lg shadow-lg">⬆️</button>
                <div></div>

                <button 
                  onTouchStart={() => setTouchKey('left', true)} onTouchEnd={() => setTouchKey('left', false)}
                  class="bg-slate-800/90 active:bg-emerald-500 rounded-xl flex items-center justify-center text-lg shadow-lg">⬅️</button>
                <div></div>
                <button 
                  onTouchStart={() => setTouchKey('right', true)} onTouchEnd={() => setTouchKey('right', false)}
                  class="bg-slate-800/90 active:bg-emerald-500 rounded-xl flex items-center justify-center text-lg shadow-lg">➡️</button>

                <div></div>
                <button 
                  onTouchStart={() => setTouchKey('down', true)} onTouchEnd={() => setTouchKey('down', false)}
                  class="bg-slate-800/90 active:bg-emerald-500 rounded-xl flex items-center justify-center text-lg shadow-lg">⬇️</button>
                <div></div>
              </div>

              <button 
                onClick={() => window.gameBridge.phaserScene && window.gameBridge.phaserScene.handleAction()}
                class="pointer-events-auto self-end w-20 h-20 bg-emerald-500/90 active:bg-emerald-400 text-slate-950 font-black text-xs rounded-full shadow-2xl flex flex-col items-center justify-center border-2 border-emerald-300 opacity-90">
                <span class="text-2xl">🖐️</span>
                <span>עזור/קח</span>
              </button>
            </div>
          )}

          {/* START OVERLAY SCREEN */}
          {gameState === 'START' && (
            <div class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-4 text-center z-40 overflow-y-auto">
              <h1 class="text-4xl sm:text-6xl font-black text-emerald-400 mb-2 drop-shadow-lg">רחוב הברוש 🌳</h1>
              <p class="text-xs sm:text-sm text-slate-300 max-w-md mb-4 leading-relaxed">
                עזרו לשכנים בקיבוץ דפנה להשיג חפצים לפני ששכנים אחרים יקדימו אתכם!
              </p>

              <div class="bg-slate-900/90 p-4 rounded-2xl mb-6 text-right text-xs text-slate-300 space-y-2 border border-slate-800 w-full max-w-sm shadow-xl">
                <p>🏠 <b>הבית שלך:</b> מכיל עד 3 חפצים בכל רגע! התחלה עם 2 חפצים מזומנים.</p>
                <p>🏷️ <b>באדג' ניקוד:</b> הסתכל על הניקוד המופיע מעל הבועה הזוהרת.</p>
                <p>🛺 <b>סכנות בכביש:</b> היזהר מקלנועיות, קורקינטים, טרקטורים ובמבות!</p>
                <p>👑 <b>אחוזת טולדו:</b> זוהרת בזהב בפינה השמאלית העליונה - מחזיקים את כל החפצים!</p>
              </div>

              <button 
                onClick={startGame}
                class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xl sm:text-2xl px-10 py-3.5 rounded-full shadow-2xl transition transform active:scale-95">
                התחל משחק! 🚀
              </button>
            </div>
          )}

          {/* GAME OVER OVERLAY SCREEN */}
          {gameState === 'GAME_OVER' && (
            <div class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-4 text-center z-40">
              <h2 class="text-3xl font-black text-yellow-400 mb-2">נגמר הזמן! ⏰</h2>
              <p class="text-lg text-slate-200 mb-6">השגת בסך הכל: <span class="font-black text-emerald-400">{score}</span> נקודות!</p>
              <button 
                onClick={startGame}
                class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-base px-8 py-3 rounded-full shadow-xl">
                שחק שוב 🔄
              </button>
            </div>
          )}

          {/* TOLEDO MANSION MODAL */}
          {gameState === 'TOLEDO' && (
            <div class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-3 text-center z-40 overflow-y-auto">
              <div class="bg-slate-900 border-2 border-yellow-500 p-5 rounded-3xl max-w-sm w-full shadow-2xl backdrop-blur-xl">
                <h2 class="text-2xl font-black text-yellow-400 mb-1">👑 אחוזת משפחת טולדו</h2>
                <p class="text-xs text-slate-400 mb-4">מלכי רחוב הברוש - יש להם הכל במחסן!</p>

                {!canPickToledoItem ? (
                  <div class="py-4 space-y-3">
                    <p class="text-slate-200 text-xs sm:text-sm animate-pulse">
                      ☕ טולדו מציע קפה ומספר על הימים הראשונים בקיבוץ דפנה...
                    </p>
                    <div class="text-3xl font-black text-yellow-500 font-mono">
                      00:0{toledoChatTimer}
                    </div>
                    {favors > 0 && (
                      <button 
                        onClick={skipToledoTalkWithFavor}
                        class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-lg">
                        תשלם 1 ⭐ טובה כדי לדלג
                      </button>
                    )}
                  </div>
                ) : (
                  <div>
                    <p class="text-xs text-slate-300 mb-3">בחר חפץ מהמחסן של טולדו:</p>
                    <div class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto p-1 custom-scrollbar">
                      {Object.values(ITEMS).map(item => (
                        <button 
                          key={item.id}
                          onClick={() => pickToledoItem(item)}
                          class="bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-yellow-500 p-2 rounded-xl flex flex-col items-center gap-1 transition">
                          <img src={SVG_ASSETS[item.key]} class="w-8 h-8 object-contain" alt={item.name} />
                          <span class="text-[10px] font-bold text-slate-200">{item.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <button 
                  onClick={() => setGameState('PLAYING')}
                  class="mt-4 text-xs text-slate-400 hover:text-white underline">
                  חזרה לרחוב
                </button>
              </div>
            </div>
          )}

          {/* 4. BOTTOM FLOATING FOOTER HUD ("YOUR HOUSE") */}
          <footer class="absolute bottom-0 left-0 right-0 z-20 bg-slate-900/80 backdrop-blur-md border-t border-slate-800/60 px-4 py-2 shadow-lg flex justify-between items-center h-12 text-xs">
            <div class="flex items-center gap-3">
              <span class="font-extrabold text-sky-400 flex items-center gap-1">🏠 הבית שלך:</span>
              <div class="flex gap-2">
                {inventory.length === 0 && <span class="text-slate-500 text-xs">ריק</span>}
                {inventory.map((item, idx) => (
                  <div key={idx} class="bg-slate-800/90 border border-slate-700/80 px-2.5 py-1 rounded-xl flex items-center gap-2 shadow-md">
                    <img src={SVG_ASSETS[item.key]} class="w-5 h-5 object-contain" alt={item.name} />
                    <span class="font-bold text-[11px] text-slate-200">{item.name}</span>
                    <button onClick={() => dropItem(idx)} class="text-red-400 hover:text-red-300 font-black text-xs mr-0.5" title="הפל לרצפה">✕</button>
                  </div>
                ))}
              </div>
            </div>

            <div class="text-[11px] text-slate-400 hidden sm:block">
              עד 3 חפצים בבית | מקש Space / E ליד בית לעזרה או איסוף
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CypressStreetApp />);
  </script>
</body>
</html>
